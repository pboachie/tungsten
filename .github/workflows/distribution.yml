# Distribution uses checksummed release assets whose build provenance
# attestation is verified first. No registry token
# enters the container context. Homebrew/winget index submission is separate.
name: distribution
on:
  pull_request:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to distribute
        required: true
        type: string
      dry_run:
        description: Build and validate without publishing
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.event.workflow_run.head_branch || inputs.tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pboachie/tungsten' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: pboachie/tungsten
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag || 'v0.1.1' }}
      DRY_RUN: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release ref and prepare manifests
        id: plan
        run: |
          set -eu
          python3 -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", os.environ["TAG"]), "invalid release tag"'
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" main
          commit=$(git rev-parse "$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            release_branch="release/${TAG#v}"
            release_branch="${release_branch%%-*}"
            git fetch origin "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
            git merge-base --is-ancestor "$commit" "origin/$release_branch"
          fi
          git show "$commit:Cargo.toml" > release-manifest.toml
          python3 -c 'import os,tomllib; assert tomllib.load(open("release-manifest.toml","rb"))["workspace"]["package"]["version"] == os.environ["TAG"][1:], "tag/manifest mismatch"'
          gh release download "$TAG" --dir release-bundle
          # Every asset distribution.py consumes (the files listed in SHA256SUMS,
          # and SHA256SUMS itself) must carry a build provenance attestation
          # signed by release.yml; a checksum from the same release is not enough.
          python3 - <<'PY' > release-assets.txt
          import re
          names = ["SHA256SUMS"]
          for line in open("release-bundle/SHA256SUMS").read().splitlines():
              match = re.fullmatch(r"[0-9a-fA-F]{64}\s+\*?([^/\\]+)", line)
              assert match and match.group(1) not in (".", ".."), "invalid checksum entry"
              names.append(match.group(1))
          assert len(names) > 1, "no release assets listed"
          print("\n".join(dict.fromkeys(names)))
          PY
          while IFS= read -r asset; do
            gh attestation verify "release-bundle/$asset" --repo pboachie/tungsten --signer-workflow pboachie/tungsten/.github/workflows/release.yml
          done < release-assets.txt
          python3 .github/scripts/distribution.py --bundle release-bundle --output distribution --tag "$TAG"
          # New releases seal these assets in release.yml. Historical releases
          # did not checksum them in SHA256SUMS and remain rehearseable.
          if grep -q '  winget-manifests.tar.gz$' release-bundle/SHA256SUMS; then
            for asset in tungsten.rb winget-manifests.tar.gz DISTRIBUTION_SHA256SUMS; do
              cmp "release-bundle/$asset" "distribution/$asset"
            done
          fi
          python3 -m venv "$RUNNER_TEMP/tungsten-distribution"
          distribution_python="$RUNNER_TEMP/tungsten-distribution/bin/python"
          "$distribution_python" -I crates/tungsten-cli/src/commands/bootstrap_python.py
          "$distribution_python" -m pip install --disable-pip-version-check jsonschema==4.25.1
          "$distribution_python" .github/scripts/validate-winget.py distribution/winget
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then echo 'publish=false' >> "$GITHUB_OUTPUT"; else echo 'publish=true' >> "$GITHUB_OUTPUT"; fi
      - name: Build both container architectures and smoke test amd64
        run: |
          set -eu
          # The pinned package upgrade runs target-architecture apk binaries.
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker buildx create --use --name tungsten-distribution
          docker buildx build --platform linux/amd64,linux/arm64 --file Dockerfile --output type=oci,dest=tungsten-image.tar distribution/container
          docker build --platform linux/amd64 --build-arg TARGETARCH=amd64 --file Dockerfile --tag tungsten-distribution-test distribution/container
          actual=$(docker run --rm tungsten-distribution-test --version)
          [ "$actual" = "tungsten ${TAG#v}" ]
          docker run --rm --entrypoint /bin/sh tungsten-distribution-test -c 'test "$(id -u)" = 65532 && test -s /etc/ssl/cert.pem && touch /work/write-test'
          ruby -c distribution/tungsten.rb
          cd distribution && sha256sum --check DISTRIBUTION_SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: |
            distribution/
            tungsten-image.tar
          retention-days: 14
          include-hidden-files: true
  publish:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: pboachie/tungsten
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
      - name: Publish the container
        id: publish
        run: |
          set -eu
          (cd distribution && sha256sum --check DISTRIBUTION_SHA256SUMS)
          # Enable the target-architecture package upgrade on this fresh runner.
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker buildx create --use --name tungsten-distribution-publish
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/pboachie/tungsten
          set -- --tag "$image:${TAG#v}"
          # `latest` follows the newest published stable release only: TAG must
          # itself be a published, non-prerelease release with a plain version
          # and the highest of them, so a release flagged prerelease, a draft
          # or a redistributed older tag never moves it.
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          newest=$(RELEASES="$releases" python3 - <<'PY'
          import os, re
          stable = re.compile(r"v(\d+)\.(\d+)\.(\d+)")
          tags = [t for t in os.environ["RELEASES"].split() if stable.fullmatch(t)]
          print(max(tags, key=lambda t: tuple(map(int, stable.fullmatch(t).groups())), default=""))
          PY
          )
          if [ -n "$newest" ] && [ "$TAG" = "$newest" ]; then set -- "$@" --tag "$image:latest"; fi
          docker buildx build --platform linux/amd64,linux/arm64 --file Dockerfile --label "org.opencontainers.image.source=https://github.com/pboachie/tungsten" --label "org.opencontainers.image.version=${TAG#v}" "$@" --metadata-file "$RUNNER_TEMP/build-metadata.json" --push distribution/container
          digest=$(python3 -c 'import json,os,re; d=json.load(open(os.environ["RUNNER_TEMP"]+"/build-metadata.json"))["containerimage.digest"]; assert re.fullmatch(r"sha256:[0-9a-f]{64}", d), "unexpected image digest"; print(d)')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the container image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/pboachie/tungsten
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
