# Release pipeline for the tungsten CLI and the runtimes.
#
# Triggers: a pushed tag v* (a real release) and a manual run (a dry run unless
# dry_run is switched off, and then only for a tag). A dry run builds and
# packages everything and runs every publish check in dry-run mode, but writes
# nothing: no GitHub Release, no attestation, no registry upload.
#
# What a real release produces (all attached to one GitHub Release):
#   tungsten-<version>-<target>.{tar.gz,zip} for x86_64 and aarch64 Linux
#   (musl, static), x86_64 and aarch64 macOS and x86_64 Windows, SHA256SUMS,
#   a CycloneDX SBOM and a build provenance attestation per archive.
# Registry publishing stays off by default. npm and PyPI trusted publishing
# require the NPM_PUBLISH and PYPI_PUBLISH repository switches respectively. The runbook is
# runbooks/release.md in tungsten-ops.
#
# Hardening: read-only token by default, each job asks only for what it needs
# (contents: write only in the GitHub Release job, id-token: write only in the
# jobs that sign or publish with provenance), every action is pinned by commit
# SHA, no pull_request_target, nothing from the event is interpolated into a
# script, and no job runs outside pboachie/tungsten (forks).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check everything, publish nothing"
        required: true
        default: true
        type: boolean
      bootstrap_only:
        description: "Run only fresh-OS bootstrap rehearsal; skip all release and publication jobs"
        required: true
        default: false
        type: boolean
      bootstrap_ops_sha:
        description: "Exact private helper commit (40 hexadecimal characters), required for bootstrap-only"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A release is never cancelled half way.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: prepare
    if: github.repository == 'pboachie/tungsten' && !(github.event_name == 'workflow_dispatch' && inputs.bootstrap_only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check dependency sources and current advisories before release preparation
        run: python3 .github/scripts/dependency_audit.py
      - name: Decide dry run or release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          release=false
          if [ "$REF_TYPE" = tag ] && { [ "$EVENT" = push ] || [ "$DRY_RUN" = false ]; }; then
            release=true
          fi
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "the tag must look like v1.2.3 or v1.2.3-rc.1, got: $tag" >&2
              exit 1
            fi
            version="${tag#v}"
          else
            tag=""
            version="0.0.0-dryrun.$(git rev-parse --short=7 HEAD)"
          fi
          if [ "$release" = true ]; then
            manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            if [ "$manifest" != "$version" ]; then
              echo "tag $tag does not match the workspace version $manifest in Cargo.toml" >&2
              exit 1
            fi
            git fetch --quiet origin main
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "the tagged commit is not on main" >&2; exit 1; }
          fi
          {
            echo "release=$release"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "release=$release tag=${tag:-none} version=$version"

  # Private helpers remain private. Only bounded, sanitized result JSON is
  # uploaded; helper contents and logs stay in the ephemeral runner directory.
  bootstrap:
    name: bootstrap (${{ matrix.os }})
    if: github.repository == 'pboachie/tungsten' && github.event_name == 'workflow_dispatch' && inputs.bootstrap_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require an immutable private helper commit
        env:
          OPS_SHA: ${{ inputs.bootstrap_ops_sha }}
        run: '[[ "$OPS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Fetch only the pinned private bootstrap helpers
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          OPS_SHA: ${{ inputs.bootstrap_ops_sha }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, re, subprocess
          sha = os.environ['OPS_SHA']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', sha) or not os.environ.get('GH_TOKEN'):
              raise SystemExit('Pinned helpers require a valid commit and private contents read access.')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-private'
          destination.mkdir()
          for name in ('test_bootstrap_wizard.py', 'pack_bootstrap_runtimes.py'):
              result = subprocess.run(['gh', 'api', f'repos/pboachie/tungsten-ops/contents/scripts/{name}?ref={sha}'], capture_output=True, timeout=60)
              if result.returncode:
                  raise SystemExit('Cannot fetch pinned bootstrap helpers; check commit availability and token contents read permission.')
              try:
                  item = json.loads(result.stdout)
                  if item.get('type') != 'file' or item.get('encoding') != 'base64' or item.get('size', 0) > 131072:
                      raise ValueError()
                  contents = base64.b64decode(item['content'])
                  if len(contents) != item['size']:
                      raise ValueError()
              except (ValueError, KeyError, TypeError):
                  raise SystemExit('Pinned helper response was invalid.') from None
              (destination / name).write_bytes(contents)
          PY
      - name: Install Windows terminal prerequisite
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywinpty==3.0.5
      - name: Install the pinned Rust toolchain and build candidate
        run: |
          rustup toolchain install
          cargo build --locked --release -p tungsten-cli
      - name: Build genuine candidate npm archives
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-private'
          with (root / 'pack.log').open('wb') as log:
              result = subprocess.run([sys.executable, str(root / 'pack_bootstrap_runtimes.py'), '--source', os.getcwd(), '--out', str(root / 'npm-candidate')], stdout=log, stderr=log, timeout=900)
          if result.returncode:
              raise SystemExit('Candidate runtime build/pack failed; private logs are not published.')
          PY
      - name: Exercise both inputs through saved and fetched installers
        env:
          OPS_SHA: ${{ inputs.bootstrap_ops_sha }}
          PUBLIC_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, re, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-private'
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-evidence'
          evidence.mkdir()
          binary = pathlib.Path.cwd() / 'target/release' / ('tungsten.exe' if os.name == 'nt' else 'tungsten')
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          failed = False
          for delivery in ('file', 'pipe'):
              for scenario in ('openapi', 'no-schema'):
                  name = f'{delivery}-{scenario}'
                  report = root / f'{name}.json'
                  result = None
                  with (root / f'{name}.log').open('wb') as log:
                      try:
                          result = subprocess.run([sys.executable, str(root / 'test_bootstrap_wizard.py'), '--source', os.getcwd(), '--binary', str(binary), '--npm-artifacts', str(root / 'npm-candidate'), '--delivery', delivery, '--case', scenario, '--report', str(report)], stdout=log, stderr=log, timeout=360)
                      except subprocess.TimeoutExpired:
                          pass
                  raw = {}
                  try:
                      if report.stat().st_size <= 16384:
                          raw = json.loads(report.read_text())
                  except (OSError, ValueError):
                      pass
                  archive = raw.get('archive_sha256', '')
                  ok = result is not None and result.returncode == 0 and raw.get('ok') is True and raw.get('local_mock_call') is True and raw.get('nonterminal_refused_before_install') is True and raw.get('installed_binary_verified') is True and raw.get('binary_sha256') == digest and isinstance(archive, str) and re.fullmatch(r'[0-9a-f]{64}', archive) is not None
                  # Never copy arbitrary helper text or diagnostics into public artifacts.
                  sanitized = {'ok': ok, 'case': scenario, 'delivery': delivery, 'public_sha': os.environ['PUBLIC_SHA'], 'private_helpers_sha': os.environ['OPS_SHA'], 'platform': platform.system(), 'binary_sha256': digest, 'prerelease_rehearsal': True, 'user_commands': 1}
                  if ok:
                      sanitized.update(archive_sha256=archive, local_mock_call=True, nonterminal_refused_before_install=True, installed_binary_verified=True)
                  else:
                      stage = raw.get('last_stage')
                      if stage not in ('checking_prerequisites', 'nonterminal_refusal', 'terminal_bootstrap_and_first_call'):
                          stage = 'helper_result_unavailable'
                      sanitized.update(last_stage=stage, exit_code=result.returncode if result is not None else None, timed_out=result is None)
                  (evidence / f'{name}.json').write_text(json.dumps(sanitized, indent=2) + '\n')
                  print(f'{name}: {"passed" if ok else "failed (private logs withheld)"}')
                  failed |= not ok
          raise SystemExit(1 if failed else 0)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bootstrap-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/bootstrap-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  woodpecker-release:
    name: Woodpecker npm release validation
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Require the exact Woodpecker tag validation when enabled
        env:
          WOODPECKER_RELEASE: ${{ needs.prepare.outputs.release == 'true' && vars.WOODPECKER_RELEASE == 'true' && 'true' || 'false' }}
          WOODPECKER_REPO_ID: ${{ vars.WOODPECKER_REPO_ID }}
          WOODPECKER_URL: ${{ vars.WOODPECKER_URL }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/wait-woodpecker-release.mjs

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install the pinned toolchain (rust-toolchain.toml) and the target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          flags="--remap-path-prefix=$PWD=/src"
          case "$TARGET" in
            *windows*) flags="$flags -C target-feature=+crt-static" ;;
            *linux-musl) export "CC_${TARGET//-/_}=musl-gcc" ;;
          esac
          export RUSTFLAGS="$flags"
          cargo build --locked --release --package tungsten-cli --bin tungsten --target "$TARGET"
      - name: Smoke test the binary
        if: "!(contains(matrix.target, 'apple-darwin') && matrix.target != 'aarch64-apple-darwin')"
        shell: bash
        run: |
          exe=tungsten
          case "$TARGET" in *windows*) exe=tungsten.exe ;; esac
          "target/$TARGET/release/$exe" --version
      - name: Archive and checksum
        shell: bash
        run: |
          exe=tungsten
          case "$TARGET" in *windows*) exe=tungsten.exe ;; esac
          sh .github/scripts/package.sh "$VERSION" "$TARGET" "target/$TARGET/release/$exe" dist
      - name: Smoke test the Windows installer against the built archive
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $asset = "tungsten-$env:VERSION-$env:TARGET.zip"
          # Exercise the real installer offline against this job's archive.
          $global:tungstenSmokeTamper = $false
          function Invoke-WebRequest {
            param([uri]$Uri, [string]$OutFile, [switch]$UseBasicParsing)
            $requested = [IO.Path]::GetFileName($Uri.AbsolutePath)
            if ($requested -eq 'SHA256SUMS') {
              Copy-Item "dist/$asset.sha256" $OutFile
            } elseif ($requested -eq $asset) {
              Copy-Item "dist/$asset" $OutFile
              if ($global:tungstenSmokeTamper) { [IO.File]::AppendAllText($OutFile, 'tampered') }
            } else { throw "Unexpected installer download: $requested" }
          }
          $dest = Join-Path $env:RUNNER_TEMP 'tungsten-installer-smoke'
          & ./install.ps1 -Version $env:VERSION -InstallDir $dest -BaseUrl 'https://release.invalid'
          $expected = & "target/$env:TARGET/release/tungsten.exe" --version
          $actual = & "$dest/tungsten.exe" --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'Installed binary smoke test failed' }
          $global:tungstenSmokeTamper = $true
          $rejected = Join-Path $env:RUNNER_TEMP 'tungsten-installer-rejected'
          try {
            & ./install.ps1 -Version $env:VERSION -InstallDir $rejected -BaseUrl 'https://release.invalid'
            throw 'Installer accepted a tampered archive'
          } catch {
            if ($_.ToString() -notlike '*checksum mismatch*') { throw }
          }
          if (Test-Path "$rejected/tungsten.exe") { throw 'Tampered binary was installed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: SHA256SUMS and SBOM
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install the pinned SBOM tool
        run: cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Write SHA256SUMS and the CycloneDX SBOM
        run: |
          cargo cyclonedx --manifest-path crates/tungsten-cli/Cargo.toml \
            --format json --spec-version 1.5 --override-filename "tungsten-$VERSION.cdx"
          mv "crates/tungsten-cli/tungsten-$VERSION.cdx.json" "dist/"
          cd dist
          for sum in *.sha256; do cat "$sum"; done | sort -k2 > SHA256SUMS
          rm -- *.sha256
          sha256sum "tungsten-$VERSION.cdx.json" >> SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          # Every listed file must exist and match.
          sha256sum --check SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: sign (build provenance)
    needs: [prepare, bundle]
    # Sigstore keyless signing through GitHub's attestation service. Only for
    # a real release; id-token is requested here and nowhere else in the build.
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/*

  github-release:
    name: GitHub Release
    needs: [prepare, bundle, attest, crates-dry-run, npm-dry-run, npm-artifacts, pypi-build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Create the release (never overwrites an existing one)
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes $prerelease

  # Publish dry runs: they prove that packaging and registry checks pass; they
  # upload nothing. Actual publishing is switched on as described in the runbook.
  crates-dry-run:
    name: crates.io dry run (runtimes/rust)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Make the manifests publishable in this throwaway checkout only
        working-directory: runtimes/rust
        # The committed manifests say `publish = false`, which is the switch
        # that keeps these crates off crates.io. The dry run flips it, and adds
        # the version a published path dependency needs, to prove the packages
        # would be accepted. Nothing is committed or uploaded.
        run: |
          sed -i 's/^publish = false$/publish = ["crates-io"]/' Cargo.toml
          sed -i 's/^tungsten-runtime = { path = "runtime" }$/tungsten-runtime = { path = "runtime", version = "0.1.0" }/' Cargo.toml
          grep -q '^publish = \["crates-io"\]$' Cargo.toml
          grep -q 'path = "runtime", version = "0.1.0"' Cargo.toml
      - name: cargo publish --dry-run
        working-directory: runtimes/rust
        run: cargo publish --workspace --dry-run --locked --allow-dirty

  npm-dry-run:
    name: npm dry run (${{ matrix.package }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [ts, mcp, webmcp]
    permissions:
      contents: read
      # npm refuses --provenance without an OIDC token, even for a dry run.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Build @elysra/tungsten-runtime (adapter packages link to it)
        if: matrix.package != 'ts'
        working-directory: runtimes/ts
        run: npm ci --ignore-scripts && npm run build
      - name: Build
        working-directory: runtimes/${{ matrix.package }}
        run: npm ci --ignore-scripts && npm run build
      - name: Use an unpublished version for rehearsal only
        if: needs.prepare.outputs.release != 'true'
        working-directory: runtimes/${{ matrix.package }}
        env:
          REHEARSAL_VERSION: ${{ needs.prepare.outputs.version }}
        # npm checks registry version conflicts even with --dry-run. Only this
        # throwaway dry-run checkout changes; release manifests stay exact.
        run: npm version "$REHEARSAL_VERSION" --no-git-tag-version --ignore-scripts
      - name: npm publish --dry-run --provenance
        working-directory: runtimes/${{ matrix.package }}
        run: npm publish --dry-run --provenance --access public --tag next

  npm-artifacts:
    name: npm distributed artifact validation
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Pack and install the distributed runtime tree
        run: node .github/scripts/check-runtime-artifacts.mjs runtime-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dist
          path: runtime-dist/*
          if-no-files-found: error
          retention-days: 14

  # npm trusted publishers must name release.yml and the npm environment for
  # all three packages before NPM_PUBLISH is enabled. No stored token is used.
  npm-publish:
    name: npm publish (trusted publishing)
    needs: [prepare, crates-dry-run, npm-dry-run, npm-artifacts, pypi-build, github-release, woodpecker-release]
    if: needs.prepare.outputs.release == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: runtime-dist
      - name: Install the supported npm CLI
        run: npm install --global --ignore-scripts npm@12.2.0
      - name: Publish validated archives, core runtime first
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          cd runtime-dist
          sha256sum --check SHA256SUMS
          npm --version
          dist_tag=latest
          case "$RELEASE_TAG" in *-*) dist_tag=next ;; esac
          # Validate every archive's version before the first registry write.
          for package in elysra-tungsten-runtime elysra-tungsten-mcp elysra-tungsten-webmcp; do
            set -- "$package"-*.tgz
            [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one archive for $package" >&2; exit 1; }
            package_version=$(tar -xOf "$1" package/package.json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).version));')
            [ "$package_version" = "${RELEASE_TAG#v}" ] || { echo "$package version $package_version does not match release tag $RELEASE_TAG; refusing to consume a different version" >&2; exit 1; }
          done
          for package in elysra-tungsten-runtime elysra-tungsten-mcp elysra-tungsten-webmcp; do
            set -- "$package"-*.tgz
            npm publish "$1" --provenance --access public --tag "$dist_tag" || {
              echo "npm publication failed for $package. Verify the npm trusted publisher for pboachie/tungsten, release.yml, environment npm; no token fallback is configured. Inspect registry state before retrying a partially completed release." >&2
              exit 1
            }
          done

  pypi-build:
    name: PyPI build and twine check
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel, then check them
        working-directory: runtimes/python
        run: |
          python -m venv "$RUNNER_TEMP/tungsten-packaging"
          packaging_python="$RUNNER_TEMP/tungsten-packaging/bin/python"
          "$packaging_python" -m pip --isolated install --disable-pip-version-check --require-hashes --only-binary=:all: -r ../../.github/packaging-requirements.lock
          "$packaging_python" -m build --no-isolation
          # Not --strict: the public repository carries no per-package README,
          # so twine warns that there is no long description.
          "$packaging_python" -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: runtimes/python/dist/*
          if-no-files-found: error
          retention-days: 14

  # Off until the PyPI project has a trusted publisher for this workflow and
  # environment, and the repository variable PYPI_PUBLISH is set to "true".
  pypi-publish:
    name: PyPI publish (trusted publishing, gated off)
    needs: [prepare, pypi-build, github-release]
    if: needs.prepare.outputs.release == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist
