# Release pipeline for the tungsten CLI and the runtimes.
#
# Triggers: a pushed tag v* (a real release) and a manual run (a dry run unless
# dry_run is switched off, and then only for a tag). A dry run builds and
# packages everything and runs every publish check in dry-run mode, but writes
# nothing: no GitHub Release, no attestation, no registry upload. It is a
# required step before tagging: run it once via workflow_dispatch on the exact
# release commit, because it runs the same dependency audit, build matrix and
# publish dry runs as the tagged release, and a tag, once pushed, is immutable
# and never moved to fix a failed run.
#
# What a real release produces (all attached to one GitHub Release):
#   tungsten-<version>-<target>.{tar.gz,zip} for x86_64 and aarch64 Linux
#   (musl, static; gnu, dynamically linked against glibc 2.34 — both arches
#   are built on the Ubuntu 22.04 runners so they share that floor, which the
#   check step below enforces on every gnu binary), x86_64 and aarch64 macOS
#   and x86_64 Windows, SHA256SUMS, a CycloneDX SBOM and a build provenance
#   attestation per archive.
# Registry publishing stays off unless its reviewed repository switch is enabled:
# NPM_PUBLISH, PYPI_PUBLISH, CRATES_PUBLISH, MAVEN_PUBLISH, NUGET_PUBLISH or
# RUBYGEMS_PUBLISH. Account/publisher/signing setup is separate. The runbook is
# runbooks/release.md in tungsten-ops.
#
# Hardening: read-only token by default, each job asks only for what it needs
# (contents: write only in the GitHub Release job, id-token: write only in the
# jobs that sign or publish with provenance), every action is pinned by commit
# SHA, no pull_request_target, nothing from the event is interpolated into a
# script, and no job runs outside pboachie/tungsten (forks).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check everything, publish nothing"
        required: true
        default: true
        type: boolean
      registry_only:
        description: "Rehearse registry packages only; requires dry_run=true and never publishes"
        required: true
        default: false
        type: boolean
      bootstrap_only:
        description: "Run only fresh-OS bootstrap rehearsal; skip all release and publication jobs"
        required: true
        default: false
        type: boolean
      bootstrap_published_version:
        description: "Published X.Y.Z baseline (no candidate build); requires bootstrap_only=true and dry_run=true"
        required: false
        default: ""
        type: string
      bootstrap_ops_sha:
        description: "Exact private helper commit (40 hexadecimal characters), required for bootstrap-only"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A release is never cancelled half way.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: prepare
    if: github.repository == 'pboachie/tungsten' && !(github.event_name == 'workflow_dispatch' && inputs.bootstrap_only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Reject published bootstrap outside bootstrap-only mode
        env:
          PUBLISHED_VERSION: ${{ inputs.bootstrap_published_version }}
          REGISTRY_ONLY: ${{ inputs.registry_only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$PUBLISHED_VERSION" ]; then
            echo "Published bootstrap requires bootstrap_only=true and dry_run=true." >&2
            exit 1
          fi
          if [ "$REGISTRY_ONLY" = true ] && [ "$DRY_RUN" != true ]; then
            echo "Registry-only rehearsal requires dry_run=true." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check dependency sources and current advisories before release preparation
        run: python3 .github/scripts/dependency_audit.py
      - name: Check all runtime versions before any release build
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node .github/scripts/check-release-version.mjs --workspace
      - name: Decide dry run or release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          release=false
          if [ "$REF_TYPE" = tag ] && { [ "$EVENT" = push ] || [ "$DRY_RUN" = false ]; }; then
            release=true
          fi
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$'; then
              echo "the tag must look like v1.2.3 or v1.2.3-rc.1, got: $tag" >&2
              exit 1
            fi
            version="${tag#v}"
          else
            tag=""
            version="0.0.0-dryrun.$(git rev-parse --short=7 HEAD)"
          fi
          if [ "$release" = true ]; then
            manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            if [ "$manifest" != "$version" ]; then
              echo "tag $tag does not match the workspace version $manifest in Cargo.toml" >&2
              exit 1
            fi
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              release_branch="release/${version%%-*}"
              git fetch --quiet origin "refs/heads/$release_branch:refs/remotes/origin/$release_branch" \
                || { echo "the tagged commit needs main or its matching release branch" >&2; exit 1; }
              [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$release_branch")" ] \
                || { echo "the tag must match the head of $release_branch" >&2; exit 1; }
            fi
          fi
          {
            echo "release=$release"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "release=$release tag=${tag:-none} version=$version"

      - name: Require the approved registry routes before a real release
        if: steps.plan.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
          CRATES_PUBLISH: ${{ vars.CRATES_PUBLISH }}
          MAVEN_PUBLISH: ${{ vars.MAVEN_PUBLISH }}
          NUGET_PUBLISH: ${{ vars.NUGET_PUBLISH }}
          RUBYGEMS_PUBLISH: ${{ vars.RUBYGEMS_PUBLISH }}
        run: |
          python3 - <<'PY'
          import os
          switches = ['NPM_PUBLISH', 'PYPI_PUBLISH', 'CRATES_PUBLISH', 'MAVEN_PUBLISH', 'NUGET_PUBLISH', 'RUBYGEMS_PUBLISH']
          # Rust registry publication is deferred from 0.1.3 to 0.2.0.
          if os.environ['RELEASE_VERSION'].split('-', 1)[0] == '0.1.3':
              if os.environ.get('CRATES_PUBLISH') != 'false':
                  raise SystemExit('0.1.3 requires CRATES_PUBLISH=false; Rust registry publication is deferred')
              switches.remove('CRATES_PUBLISH')
          missing = [name for name in switches if os.environ.get(name) != 'true']
          if missing:
              raise SystemExit('Finish registry setup before approving a release tag: ' + ', '.join(missing))
          PY

      # The release notes are the tagged CHANGELOG section, never the pull
      # request list: a release page must carry the breaking changes and
      # migration notes. A real release fails on a missing, empty or undated
      # section; a dry run prints the notes it would publish (the Unreleased
      # section when the checkout has no section for a dry-run version).
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          if python3 .github/scripts/release_notes.py --changelog CHANGELOG.md --version "$VERSION" --output release-notes/release-notes.md; then
            echo "--- release notes for $VERSION ---"
            cat release-notes/release-notes.md
          else
            if [ "$RELEASE" = "true" ]; then
              echo "a release needs a dated CHANGELOG section for $VERSION" >&2
              exit 1
            fi
            echo "no CHANGELOG section for $VERSION (dry run); the Unreleased notes a release would ship:"
            python3 .github/scripts/release_notes.py --changelog CHANGELOG.md --version Unreleased
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/release-notes.md
          if-no-files-found: ignore
          retention-days: 14

  # Private helpers remain private. Only bounded, sanitized result JSON is
  # uploaded; helper contents and logs stay in the ephemeral runner directory.
  bootstrap:
    name: bootstrap (${{ matrix.os }})
    if: github.repository == 'pboachie/tungsten' && github.event_name == 'workflow_dispatch' && inputs.bootstrap_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require an immutable private helper commit
        env:
          OPS_SHA: ${{ inputs.bootstrap_ops_sha }}
          PUBLISHED_VERSION: ${{ inputs.bootstrap_published_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY_ONLY: ${{ inputs.registry_only }}
        run: |
          [ "$REGISTRY_ONLY" != true ] || { echo "Bootstrap and registry-only rehearsals are separate modes." >&2; exit 1; }
          [[ "$OPS_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          if [ -n "$PUBLISHED_VERSION" ]; then
            [[ "$PUBLISHED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [ "$DRY_RUN" = true ] || exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch only the pinned private bootstrap helpers
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          OPS_SHA: ${{ inputs.bootstrap_ops_sha }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, re, subprocess
          sha = os.environ['OPS_SHA']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', sha) or not os.environ.get('GH_TOKEN'):
              raise SystemExit('Pinned helpers require a valid commit and private contents read access.')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-private'
          destination.mkdir()
          for name in ('test_bootstrap_wizard.py', 'pack_bootstrap_runtimes.py'):
              result = subprocess.run(['gh', 'api', f'repos/pboachie/tungsten-ops/contents/scripts/{name}?ref={sha}'], capture_output=True, timeout=60)
              if result.returncode:
                  raise SystemExit('Cannot fetch pinned bootstrap helpers; check commit availability and token contents read permission.')
              try:
                  item = json.loads(result.stdout)
                  if item.get('type') != 'file' or item.get('encoding') != 'base64' or item.get('size', 0) > 131072:
                      raise ValueError()
                  contents = base64.b64decode(item['content'])
                  if len(contents) != item['size']:
                      raise ValueError()
              except (ValueError, KeyError, TypeError):
                  raise SystemExit('Pinned helper response was invalid.') from None
              (destination / name).write_bytes(contents)
          PY
      - name: Install Windows terminal prerequisite
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywinpty==3.0.5
      - name: Install the pinned Rust toolchain and build candidate
        if: inputs.bootstrap_published_version == ''
        run: |
          rustup toolchain install
          cargo build --locked --release -p tungsten-cli
      - name: Build genuine candidate npm archives
        if: inputs.bootstrap_published_version == ''
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-private'
          with (root / 'pack.log').open('wb') as log:
              result = subprocess.run([sys.executable, str(root / 'pack_bootstrap_runtimes.py'), '--source', os.getcwd(), '--out', str(root / 'npm-candidate')], stdout=log, stderr=log, timeout=900)
          if result.returncode:
              raise SystemExit('Candidate runtime build/pack failed; private logs are not published.')
          PY
      - name: Exercise both inputs through saved and fetched installers
        env:
          OPS_SHA: ${{ inputs.bootstrap_ops_sha }}
          PUBLIC_SHA: ${{ github.sha }}
          PUBLISHED_VERSION: ${{ inputs.bootstrap_published_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, re, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-private'
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-evidence'
          evidence.mkdir()
          binary = pathlib.Path.cwd() / 'target/release' / ('tungsten.exe' if os.name == 'nt' else 'tungsten')
          version = os.environ.get('PUBLISHED_VERSION', '')
          if version and not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid published version.')
          digest = None if version else hashlib.sha256(binary.read_bytes()).hexdigest()
          acquisition = ['--published-version', version] if version else ['--source', os.getcwd(), '--binary', str(binary), '--npm-artifacts', str(root / 'npm-candidate')]
          arch = 'aarch64' if platform.machine().lower() in ('arm64', 'aarch64') else 'x86_64'
          target = arch + ('-pc-windows-msvc' if os.name == 'nt' else '-apple-darwin' if platform.system() == 'Darwin' else '-unknown-linux-musl')
          asset_url = f'https://github.com/pboachie/tungsten/releases/download/v{version}/tungsten-{version}-{target}' + ('.zip' if os.name == 'nt' else '.tar.gz')
          installer_url = f'https://raw.githubusercontent.com/pboachie/tungsten/v{version}/install.' + ('ps1' if os.name == 'nt' else 'sh')
          runtime_url = f'https://registry.npmjs.org/@elysra/tungsten-runtime/-/tungsten-runtime-{version}.tgz'
          def hash_ok(value):
              return isinstance(value, str) and re.fullmatch(r'[0-9a-f]{64}', value) is not None
          failed = False
          for delivery in ('file', 'pipe'):
              for scenario in ('openapi', 'no-schema'):
                  name = f'{delivery}-{scenario}'
                  report = root / f'{name}.json'
                  result = None
                  with (root / f'{name}.log').open('wb') as log:
                      try:
                          result = subprocess.run([sys.executable, str(root / 'test_bootstrap_wizard.py'), *acquisition, '--delivery', delivery, '--case', scenario, '--report', str(report)], stdout=log, stderr=log, timeout=360)
                      except subprocess.TimeoutExpired:
                          pass
                  raw = {}
                  try:
                      if report.stat().st_size <= 16384:
                          loaded = json.loads(report.read_text())
                          raw = loaded if isinstance(loaded, dict) else {}
                  except (OSError, ValueError):
                      pass
                  archive = raw.get('archive_sha256', '')
                  binary_hash = raw.get('binary_sha256')
                  ok = result is not None and result.returncode == 0 and raw.get('ok') is True and raw.get('local_mock_call') is True and raw.get('nonterminal_refused_before_install') is True and raw.get('installed_binary_verified') is True and hash_ok(binary_hash) and hash_ok(archive)
                  if version:
                      runtime = raw.get('published_runtime')
                      ok = ok and raw.get('acquisition_mode') == 'published' and raw.get('release_tag') == 'v' + version and raw.get('helper_overrides') is False and raw.get('archive_url') == asset_url and raw.get('installer_url') == installer_url and hash_ok(raw.get('reference_installer_sha256')) and raw.get('npm_source') == 'https://registry.npmjs.org/' and isinstance(runtime, dict) and runtime.get('version') == version and runtime.get('resolved') == runtime_url and raw.get('build_attestation_verified') is True
                  else:
                      ok = ok and binary_hash == digest
                  # Never copy arbitrary helper text, URLs or diagnostics into public artifacts.
                  sanitized = {'ok': ok, 'case': scenario, 'delivery': delivery, 'public_sha': os.environ['PUBLIC_SHA'], 'private_helpers_sha': os.environ['OPS_SHA'], 'platform': platform.system(), 'prerelease_rehearsal': not bool(version), 'user_commands': 1}
                  if ok:
                      sanitized.update(archive_sha256=archive, binary_sha256=binary_hash, local_mock_call=True, nonterminal_refused_before_install=True, installed_binary_verified=True)
                      if version:
                          sanitized.update(acquisition_mode='published', release_tag='v' + version, helper_overrides=False, archive_url=asset_url, installer_url=installer_url, reference_installer_sha256=raw['reference_installer_sha256'], npm_source='https://registry.npmjs.org/', runtime_version=version, runtime_url=runtime_url, build_attestation_verified=True)
                  else:
                      stage = raw.get('last_stage')
                      if stage not in ('checking_prerequisites', 'acquiring_published_reference', 'nonterminal_refusal', 'terminal_bootstrap_and_first_call'):
                          stage = 'helper_result_unavailable'
                      sanitized.update(last_stage=stage, exit_code=result.returncode if result is not None else None, timed_out=result is None)
                  (evidence / f'{name}.json').write_text(json.dumps(sanitized, indent=2) + '\n')
                  print(f'{name}: {"passed" if ok else "failed (private logs withheld)"}')
                  failed |= not ok
          raise SystemExit(1 if failed else 0)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bootstrap-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/bootstrap-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  woodpecker-release:
    name: Woodpecker registry release validation
    # The wait must not start before the artifacts it gates exist, so it runs
    # after the npm artifact validation instead of racing the build jobs. A
    # timeout here fails this gate and skips every registry publication; the GitHub
    # Release and attestation jobs do not depend on it.
    needs: [prepare, npm-artifacts]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.registry_only) }}
    runs-on: ubuntu-latest
    # WAIT_DEADLINE_MINUTES (45) in wait-woodpecker-release.mjs plus checkout
    # and setup.
    timeout-minutes: 50
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history with tags: the dry-run gate exercise resolves the
          # last released tag and its commit locally.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Require the exact Woodpecker tag validation when enabled
        env:
          WOODPECKER_RELEASE: ${{ needs.prepare.outputs.release == 'true' && vars.WOODPECKER_RELEASE == 'true' && 'true' || 'false' }}
          # A dry run exercises the same wait against the last released tag,
          # so the gate is tested before a release relies on it.
          WOODPECKER_EXERCISE: ${{ needs.prepare.outputs.release != 'true' && vars.WOODPECKER_RELEASE == 'true' && 'true' || 'false' }}
          WOODPECKER_REPO_ID: ${{ vars.WOODPECKER_REPO_ID }}
          WOODPECKER_URL: ${{ vars.WOODPECKER_URL }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/wait-woodpecker-release.mjs

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.registry_only) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          # Both -gnu targets build against the same Ubuntu 22.04 glibc so
          # x86_64 and aarch64 share one documented floor (GLIBC_2.34);
          # aarch64 on ubuntu-24.04-arm needed GLIBC_2.39 instead (#123).
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install the pinned toolchain (rust-toolchain.toml) and the target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          flags="--remap-path-prefix=$PWD=/src"
          case "$TARGET" in
            *windows*) flags="$flags -C target-feature=+crt-static" ;;
            *linux-musl) export "CC_${TARGET//-/_}=musl-gcc" ;;
          esac
          export RUSTFLAGS="$flags"
          cargo build --locked --release --package tungsten-cli --bin tungsten --target "$TARGET"
      - name: Enforce the documented glibc floor (linux-gnu)
        # The -gnu archives promise glibc 2.34 or newer (the floor x86_64 and
        # aarch64 share since both build on the Ubuntu 22.04 runners; the musl
        # archives are static). The highest GLIBC_ symbol version recorded in
        # the binary must not exceed that floor, so a toolchain bump cannot
        # silently raise it again (#123).
        if: contains(matrix.target, 'linux-gnu')
        shell: bash
        run: |
          floor=2.34
          binary="target/$TARGET/release/tungsten"
          highest=$(objdump -T "$binary" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -n 1)
          [ -n "$highest" ] || { echo "no GLIBC_ symbol versions found in $binary; expected a glibc dynamic executable" >&2; exit 1; }
          version=${highest#GLIBC_}
          if [ "$(printf '%s\n' "$floor" "$version" | sort -V | tail -n 1)" != "$floor" ]; then
            echo "$binary needs $highest, above the documented floor GLIBC_$floor" >&2
            exit 1
          fi
          echo "$binary: highest glibc symbol version is $highest, within the documented floor GLIBC_$floor"
      # Every target executes its own binary before it ships. x86_64-apple-darwin
      # is cross-compiled on the arm64 runner and runs under Rosetta 2, so the
      # shipped x86_64 macOS binary is executed instead of skipped (issue #126).
      - name: Smoke test the binary
        shell: bash
        run: |
          exe=tungsten
          case "$TARGET" in *windows*) exe=tungsten.exe ;; esac
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            softwareupdate --install-rosetta --agree-to-license || true
            arch -x86_64 "target/$TARGET/release/$exe" --version
          else
            "target/$TARGET/release/$exe" --version
          fi
      - name: Archive and checksum
        shell: bash
        run: |
          exe=tungsten
          case "$TARGET" in *windows*) exe=tungsten.exe ;; esac
          sh .github/scripts/package.sh "$VERSION" "$TARGET" "target/$TARGET/release/$exe" dist
      - name: Smoke test the Windows installer against the built archive
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $asset = "tungsten-$env:VERSION-$env:TARGET.zip"
          # Exercise the real installer offline against this job's archive.
          $global:tungstenSmokeTamper = $false
          function Invoke-WebRequest {
            param([uri]$Uri, [string]$OutFile, [switch]$UseBasicParsing)
            $requested = [IO.Path]::GetFileName($Uri.AbsolutePath)
            if ($requested -eq 'SHA256SUMS') {
              Copy-Item "dist/$asset.sha256" $OutFile
            } elseif ($requested -eq $asset) {
              Copy-Item "dist/$asset" $OutFile
              if ($global:tungstenSmokeTamper) { [IO.File]::AppendAllText($OutFile, 'tampered') }
            } else { throw "Unexpected installer download: $requested" }
          }
          $dest = Join-Path $env:RUNNER_TEMP 'tungsten-installer-smoke'
          & ./install.ps1 -Version $env:VERSION -InstallDir $dest -BaseUrl 'https://release.invalid'
          $expected = & "target/$env:TARGET/release/tungsten.exe" --version
          $actual = & "$dest/tungsten.exe" --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'Installed binary smoke test failed' }
          $global:tungstenSmokeTamper = $true
          $rejected = Join-Path $env:RUNNER_TEMP 'tungsten-installer-rejected'
          try {
            & ./install.ps1 -Version $env:VERSION -InstallDir $rejected -BaseUrl 'https://release.invalid'
            throw 'Installer accepted a tampered archive'
          } catch {
            if ($_.ToString() -notlike '*checksum mismatch*') { throw }
          }
          if (Test-Path "$rejected/tungsten.exe") { throw 'Tampered binary was installed' }
          # -Init without terminal input must refuse (exit 1) before anything
          # is downloaded. The -Init cancellation path itself (exit 4) needs a
          # real terminal and a user refusing the interactive prompts, so it is
          # not covered by the pipeline; this gap is documented here (issue #126).
          $initRefused = Join-Path $env:RUNNER_TEMP 'tungsten-installer-init-refused'
          try {
            & ./install.ps1 -Version $env:VERSION -InstallDir $initRefused -BaseUrl 'https://release.invalid' -Init
            throw 'install.ps1 -Init accepted redirected input'
          } catch {
            if ($_.ToString() -notlike '*terminal input*') { throw }
          }
          if (Test-Path "$initRefused/tungsten.exe") { throw 'Installer ran -Init after refusing terminal input' }
      # Unix counterpart of the Windows installer smoke (issue #126): the real
      # install.sh installs this job's archive from a local mirror laid out like
      # releases/download (<base>/<tag>/<asset> plus SHA256SUMS); with a custom
      # TUNGSTEN_RELEASE_BASE_URL the gh attestation check is skipped, so the
      # smoke stays offline. It runs for all six Unix targets (musl, gnu and
      # darwin; TUNGSTEN_LIBC=gnu selects the gnu archives), then repeats
      # against a tampered archive and must fail with exit 1 ("checksum
      # mismatch"), installing nothing. The --init cancellation path (exit 4)
      # is not covered: install.sh refuses --init without a controlling
      # terminal, which no runner provides; only the refusal is asserted.
      - name: Smoke test install.sh against the built archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="tungsten-$VERSION-$TARGET"
          asset="$name.tar.gz"
          work="$RUNNER_TEMP/install-sh-smoke"
          www="$work/www"
          mkdir -p "$www/v$VERSION" "$work/logs"
          cp "dist/$asset" "$www/v$VERSION/$asset"
          cp "dist/$asset.sha256" "$www/v$VERSION/SHA256SUMS"
          # Serve the archive like a release mirror; install.sh downloads
          # $TUNGSTEN_RELEASE_BASE_URL/v$VERSION/{SHA256SUMS,$asset}.
          python3 -m http.server 8642 --bind 127.0.0.1 --directory "$www" \
            >"$work/logs/http.server.log" 2>&1 &
          server=$!
          cleanup() { kill "$server" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8642/v$VERSION/SHA256SUMS" -o /dev/null; then ready=1; break; fi
            sleep 0.5
          done
          [ "$ready" -eq 1 ] || { echo "the local mirror did not come up" >&2; cat "$work/logs/http.server.log" >&2; exit 1; }
          # Run both the installer and its installed binary under the target
          # architecture: the installer selects its archive from uname -m.
          # x86_64-apple-darwin runs under Rosetta on the arm64 runner.
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            softwareupdate --install-rosetta --agree-to-license || true
            run() { arch -x86_64 "$@"; }
          else
            run() { "$@"; }
          fi
          export TUNGSTEN_RELEASE_BASE_URL=http://127.0.0.1:8642
          case "$TARGET" in *linux-gnu) export TUNGSTEN_LIBC=gnu ;; esac
          dest="$work/bin"
          run sh ./install.sh --version "$VERSION" --dir "$dest"
          expected=$(run "target/$TARGET/release/tungsten" --version)
          actual=$(run "$dest/tungsten" --version)
          [ -n "$expected" ] || { echo "the built binary printed no --version" >&2; exit 1; }
          if [ "$actual" != "$expected" ]; then
            echo "the installed binary reports '$actual', the built binary '$expected'" >&2
            exit 1
          fi
          # The same mirror with a tampered archive must fail with exit 1 and
          # a checksum mismatch, installing nothing (mirrors the PowerShell smoke).
          printf tampered >>"$www/v$VERSION/$asset"
          rejected="$work/rejected"
          rc=0
          run sh ./install.sh --version "$VERSION" --dir "$rejected" 2>"$work/logs/rejected.log" || rc=$?
          [ "$rc" -eq 1 ] || { echo "install.sh exited $rc on a tampered archive, expected 1" >&2; cat "$work/logs/rejected.log" >&2; exit 1; }
          grep -q "checksum mismatch" "$work/logs/rejected.log" || { echo "no checksum mismatch reported:" >&2; cat "$work/logs/rejected.log" >&2; exit 1; }
          [ ! -e "$rejected/tungsten" ] || { echo "the tampered archive was installed" >&2; exit 1; }
          # --init must refuse without a controlling terminal (exit 1, before
          # any download); the exit 4 cancellation path itself needs a real
          # terminal and is documented as a gap at the top of this step.
          init_dir="$work/init-refused"
          rc=0
          run sh ./install.sh --init --version "$VERSION" --dir "$init_dir" </dev/null 2>"$work/logs/init.log" || rc=$?
          [ "$rc" -eq 1 ] || { echo "install.sh --init without a terminal exited $rc, expected 1" >&2; cat "$work/logs/init.log" >&2; exit 1; }
          grep -q "controlling terminal" "$work/logs/init.log" || { echo "unexpected --init refusal:" >&2; cat "$work/logs/init.log" >&2; exit 1; }
          echo "install.sh smoke passed for $TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: SHA256SUMS and SBOM
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install the pinned SBOM tool
        run: cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Write SHA256SUMS and the CycloneDX SBOM
        run: |
          cargo cyclonedx --manifest-path crates/tungsten-cli/Cargo.toml \
            --format json --spec-version 1.5 --override-filename "tungsten-$VERSION.cdx"
          mv "crates/tungsten-cli/tungsten-$VERSION.cdx.json" "dist/"
          cd dist
          for sum in *.sha256; do cat "$sum"; done | sort -k2 > SHA256SUMS
          rm -- *.sha256
          sha256sum "tungsten-$VERSION.cdx.json" >> SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          # Every listed file must exist and match.
          sha256sum --check SHA256SUMS
          ls -l
      - name: Include distribution assets before publication
        run: |
          set -eu
          python3 .github/scripts/distribution.py --bundle dist --output distribution --tag "v$VERSION"
          python3 -m venv "$RUNNER_TEMP/tungsten-distribution"
          distribution_python="$RUNNER_TEMP/tungsten-distribution/bin/python"
          "$distribution_python" -m pip --isolated install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/packaging-requirements.lock
          "$distribution_python" .github/scripts/validate-winget.py distribution/winget
          ruby -c distribution/tungsten.rb
          (cd distribution && sha256sum --check DISTRIBUTION_SHA256SUMS)
          cp distribution/tungsten.rb distribution/winget-manifests.tar.gz distribution/DISTRIBUTION_SHA256SUMS dist/
          cd dist
          sha256sum tungsten.rb winget-manifests.tar.gz DISTRIBUTION_SHA256SUMS >> SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: sign (build provenance)
    needs: [prepare, bundle]
    # Sigstore keyless signing through GitHub's attestation service. Only for
    # a real release; id-token is requested here and nowhere else in the build.
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  github-release:
    name: GitHub Release
    needs: [prepare, bundle, attest, crates-dry-run, npm-dry-run, npm-artifacts, pypi-build, native-artifacts]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes
      - name: Create the release (never overwrites an existing one)
        env:
          GLIBC_FLOOR: "2.34"
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # The notes are the tagged CHANGELOG section, topped by the fixed
          # install note; --generate-notes appends the pull-request list.
          { printf '%s\n' \
              '## Install notes' \
              '' \
              "- The Linux gnu archives (*-unknown-linux-gnu) are dynamically linked and need glibc ${GLIBC_FLOOR} or newer, on x86_64 and aarch64 alike (Debian 12, Ubuntu 22.04, RHEL 9 and Amazon Linux 2023 all qualify)." \
              '- The Linux musl archives (*-unknown-linux-musl) are statically linked and have no glibc requirement.' \
              '- install.sh defaults to musl; set TUNGSTEN_LIBC=gnu only on systems with glibc '"${GLIBC_FLOOR}"' or newer.' \
              '' \
              '---' \
              ''
            cat release-notes/release-notes.md; } > release-notes/body.md
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file release-notes/body.md --generate-notes $prerelease

  # Publish dry runs: they prove that packaging and registry checks pass; they
  # upload nothing. Actual publishing is switched on as described in the runbook.
  crates-dry-run:
    name: crates.io dry run (runtimes/rust)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo publish --dry-run
        working-directory: runtimes/rust
        run: cargo publish --workspace --dry-run --locked
      - name: Freeze the compiled Rust archives
        run: |
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          python3 .github/scripts/registry-artifacts.py --package rust --version "$version" --directory rust-dist --stage-from runtimes/rust/target/package/tmp-crate
      - name: Rehearse the precredential Rust archive comparison
        run: |
          (cd runtimes/rust && cargo publish --workspace --dry-run --locked)
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          python3 .github/scripts/registry-artifacts.py --package rust --version "$version" --directory rust-dist --compare-build runtimes/rust/target/package/tmp-crate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-dist
          path: rust-dist/*
          if-no-files-found: error
          retention-days: 14

  # First crate ownership/bootstrap and each trusted publisher must be
  # configured before the maintainer enables CRATES_PUBLISH. No token fallback.
  crates-publish:
    name: crates.io publish (trusted publishing)
    needs: [prepare, crates-dry-run, github-release, woodpecker-release]
    if: needs.prepare.outputs.release == 'true' && vars.CRATES_PUBLISH == 'true' && needs.prepare.outputs.version != '0.1.3' && !startsWith(needs.prepare.outputs.version, '0.1.3-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-dist
          path: rust-dist
      - name: Compile and compare the exact packages before credentials
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 .github/scripts/registry-artifacts.py --package rust --version "${RELEASE_TAG#v}" --directory rust-dist
          (cd runtimes/rust && cargo publish --workspace --dry-run --locked)
          python3 .github/scripts/registry-artifacts.py --package rust --version "${RELEASE_TAG#v}" --directory rust-dist --compare-build runtimes/rust/target/package/tmp-crate
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-auth
      - name: Publish runtime before its CLI-kit dependent
        working-directory: runtimes/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Compilation and exact archive comparison succeeded before OIDC.
          # Cargo orders workspace dependencies and waits for registry indexing.
          cargo publish --workspace --locked --no-verify
      - name: Verify both public crates match the tested archives
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/verify-published-registries.py --package rust --version "${RELEASE_TAG#v}" --directory rust-dist

  npm-dry-run:
    name: npm dry run (${{ matrix.package }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [ts, mcp, webmcp]
    permissions:
      contents: read
      # npm refuses --provenance without an OIDC token, even for a dry run.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Build @elysra/tungsten-runtime (adapter packages link to it)
        if: matrix.package != 'ts'
        working-directory: runtimes/ts
        run: npm ci --ignore-scripts && npm run build
      - name: Build
        working-directory: runtimes/${{ matrix.package }}
        run: npm ci --ignore-scripts && npm run build
      - name: Use an unpublished version for rehearsal only
        if: needs.prepare.outputs.release != 'true'
        working-directory: runtimes/${{ matrix.package }}
        env:
          REHEARSAL_VERSION: ${{ needs.prepare.outputs.version }}
        # npm checks registry version conflicts even with --dry-run. Only this
        # throwaway dry-run checkout changes; release manifests stay exact.
        run: npm version "$REHEARSAL_VERSION" --no-git-tag-version --ignore-scripts
      - name: npm publish --dry-run --provenance
        working-directory: runtimes/${{ matrix.package }}
        run: npm publish --dry-run --provenance --access public --tag next

  npm-artifacts:
    name: npm distributed artifact validation
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Pack and install the distributed runtime tree
        run: node .github/scripts/check-runtime-artifacts.mjs runtime-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: runtime-dist/*
          if-no-files-found: error
          retention-days: 14

  # npm trusted publishers must name release.yml and the npm environment for
  # all three packages before NPM_PUBLISH is enabled. No stored token is used.
  npm-publish:
    name: npm publish (trusted publishing)
    needs: [prepare, crates-dry-run, npm-dry-run, npm-artifacts, pypi-build, github-release, woodpecker-release]
    if: needs.prepare.outputs.release == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: runtime-dist
      - name: Install the supported npm CLI
        run: npm install --global --ignore-scripts npm@12.2.0
      - name: Publish validated archives, core runtime first
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          cd runtime-dist
          sha256sum --check SHA256SUMS
          npm --version
          dist_tag=latest
          case "$RELEASE_TAG" in *-*) dist_tag=next ;; esac
          # Validate every package's identity and dependencies before any write.
          python3 - "${RELEASE_TAG#v}" <<'PY'
          import json, pathlib, sys, tarfile
          version = sys.argv[1]
          names = ['@elysra/tungsten-runtime', '@elysra/tungsten-mcp', '@elysra/tungsten-webmcp']
          expected = {name.replace('@', '').replace('/', '-') + '-' + version + '.tgz' for name in names}
          if {path.name for path in pathlib.Path('.').glob('*.tgz')} != expected:
              raise SystemExit('unexpected npm archive inventory')
          for name in names:
              path = pathlib.Path(name.replace('@', '').replace('/', '-') + '-' + version + '.tgz')
              with tarfile.open(path, 'r:gz') as archive:
                  members = [member for member in archive if member.name == 'package/package.json']
                  if len(members) != 1 or not members[0].isfile() or members[0].size > 1048576:
                      raise SystemExit('unexpected npm package metadata')
                  manifest = json.load(archive.extractfile(members[0]))
              if (manifest['name'], manifest['version'], manifest['license'], manifest['engines']['node']) != (name, version, 'Apache-2.0', '>=22'):
                  raise SystemExit('npm archive identity or requirements differ from release')
              dependency = (manifest.get('dependencies', {}) if name == names[1] else manifest.get('peerDependencies', {})).get(names[0])
              if name != names[0] and dependency != '^' + version:
                  raise SystemExit('npm adapter runtime dependency differs from release')
          PY
          for package in elysra-tungsten-runtime elysra-tungsten-mcp elysra-tungsten-webmcp; do
            set -- "$package"-*.tgz
            [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one archive for $package" >&2; exit 1; }
            package_version=$(tar -xOf "$1" package/package.json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).version));')
            [ "$package_version" = "${RELEASE_TAG#v}" ] || { echo "$package version $package_version does not match release tag $RELEASE_TAG; refusing to consume a different version" >&2; exit 1; }
          done
          for package in elysra-tungsten-runtime elysra-tungsten-mcp elysra-tungsten-webmcp; do
            set -- "$package"-*.tgz
            npm publish "$1" --provenance --access public --tag "$dist_tag" --ignore-scripts || {
              echo "npm publication failed for $package. Verify the npm trusted publisher for pboachie/tungsten, release.yml, environment npm; no token fallback is configured. Inspect registry state before retrying a partially completed release." >&2
              exit 1
            }
          done
      - name: Verify all three public npm archives
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/verify-published-registries.py --package npm --version "${RELEASE_TAG#v}" --directory runtime-dist

  pypi-build:
    name: PyPI build and twine check
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel, then check them
        working-directory: runtimes/python
        run: |
          python -m venv "$RUNNER_TEMP/tungsten-packaging"
          packaging_python="$RUNNER_TEMP/tungsten-packaging/bin/python"
          "$packaging_python" -m pip --isolated install --disable-pip-version-check --require-hashes --only-binary=:all: -r ../../.github/packaging-requirements.lock
          "$packaging_python" -m build --no-isolation
          "$packaging_python" -m twine check dist/*
      - name: Freeze the checked Python archives
        run: |
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          python3 .github/scripts/registry-artifacts.py --package python --version "$version" --directory python-dist --stage-from runtimes/python/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python-dist/*
          if-no-files-found: error
          retention-days: 14

  # The PyPI trusted publisher for tungsten-runtime must name release.yml and
  # the pypi environment before the repository variable PYPI_PUBLISH is set
  # to "true". No stored token is used.
  pypi-publish:
    name: PyPI publish (trusted publishing)
    needs: [prepare, pypi-build, github-release, woodpecker-release]
    if: needs.prepare.outputs.release == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: python-dist
      - name: Validate the built version before any registry write
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          python3 .github/scripts/registry-artifacts.py --package python --version "${RELEASE_TAG#v}" --directory python-dist
          mkdir upload-dist
          cp python-dist/*.whl python-dist/*.tar.gz upload-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload-dist
      - name: Verify the public wheel and sdist match the tested archives
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/verify-published-registries.py --package python --version "${RELEASE_TAG#v}" --directory python-dist

  native-artifacts:
    name: native runtime archives (${{ matrix.package }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [java, csharp, ruby]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.package == 'java'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.package == 'csharp'
        with:
          dotnet-version: 10.0.401
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        if: matrix.package == 'ruby'
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Build and verify the registry archive inventory
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python3 .github/scripts/native-runtime-artifacts.py --package "$PACKAGE" --version "$version" --directory native-dist --build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dist-${{ matrix.package }}
          path: native-dist/*
          if-no-files-found: error
          retention-days: 14

  maven-publish:
    name: Maven Central publish
    needs: [prepare, native-artifacts, github-release, woodpecker-release]
    if: needs.prepare.outputs.release == 'true' && vars.MAVEN_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-dist-java
          path: native-dist
      - name: Verify reviewed package version and checksums before credentials
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/native-runtime-artifacts.py --package java --version "${RELEASE_TAG#v}" --directory native-dist
      - name: Sign and publish the frozen archives through Central
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
        run: |
          python3 .github/scripts/central-publish.py --directory native-dist --version "${RELEASE_TAG#v}" --output central-bundle.zip --receipt central-deployment.json --publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: central-deployment
          path: central-deployment.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify the public Maven component matches the tested archives
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/verify-published-registries.py --package java --version "${RELEASE_TAG#v}" --directory native-dist

  nuget-publish:
    name: NuGet publish (trusted publishing)
    needs: [prepare, native-artifacts, github-release, woodpecker-release]
    if: needs.prepare.outputs.release == 'true' && vars.NUGET_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-dist-csharp
          path: native-dist
      - name: Verify reviewed package version and checksums before credentials
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          test -n "$NUGET_USER" || { echo 'Configure the reviewed NuGet account and trusted-publishing policy first.' >&2; exit 1; }
          python3 .github/scripts/native-runtime-artifacts.py --package csharp --version "${RELEASE_TAG#v}" --directory native-dist
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-auth
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the validated package without rebuilding
        env:
          NUGET_API_KEY: ${{ steps.nuget-auth.outputs.NUGET_API_KEY }}
        run: dotnet nuget push native-dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Verify the public package entries and repository signature
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 .github/scripts/verify-published-registries.py --package csharp --version "${RELEASE_TAG#v}" --directory native-dist --save-download public-nuget
          dotnet nuget verify --all public-nuget/*.nupkg

  rubygems-publish:
    name: RubyGems publish (trusted publishing)
    needs: [prepare, native-artifacts, github-release, woodpecker-release]
    if: needs.prepare.outputs.release == 'true' && vars.RUBYGEMS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-dist-ruby
          path: native-dist
      - name: Verify reviewed package version and checksums before credentials
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/native-runtime-artifacts.py --package ruby --version "${RELEASE_TAG#v}" --directory native-dist
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          trusted-publisher: true
      - name: Publish the validated gem without rebuilding
        run: gem push --host https://rubygems.org native-dist/*.gem
      - name: Verify the public gem matches the tested archive
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/verify-published-registries.py --package ruby --version "${RELEASE_TAG#v}" --directory native-dist
