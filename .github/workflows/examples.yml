# Runnable public examples. Independent of the maintainer conformance status.
name: examples

on:
  push:
    branches: ["**", "!gh-pages"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    name: runnable example gallery
    if: github.repository == 'pboachie/tungsten' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      # setup-python's archive installer upgrades pip before returning; force
      # that bootstrap to use only the PSF hash-verified local wheel.
      - name: Stage verified pip for interpreter setup
        shell: bash
        run: python -I crates/tungsten-cli/src/commands/bootstrap_python.py --fetch-only --wheel-dir "$RUNNER_TEMP/tungsten-pip-bootstrap"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        env:
          PIP_CONFIG_FILE: ${{ runner.os == 'Windows' && 'nul' || '/dev/null' }}
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: ${{ runner.temp }}/tungsten-pip-bootstrap/pip-26.2.2-py3-none-any.whl
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        with:
          python-version: "3.12.15"
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.13+9.0.LTS"
          check-latest: true
      - name: Prepare job-local Java TLS trust
        run: python3 .github/scripts/prepare_java_ci_trust.py --major 21
      - name: Verify patched Java runtime and trust roots
        run: python3 .github/scripts/check_java_toolchain.py --major 21
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3.13"
          bundler-cache: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the matching compiler
        run: cargo build --locked -p tungsten-cli
      - name: Run every indexed recipe and check README drift
        env:
          TUNGSTEN: ${{ github.workspace }}/target/debug/tungsten
        run: python3 examples/run.py --check

  # Runs actions/tungsten from this checkout against a small consumer project:
  # an unchanged contract passes, a changed contract (stale output) and an
  # invalid manifest fail with the expected `failed` output, and the project
  # passes again after regeneration. It installs the published release named
  # below through the checked-out install.sh, with provenance verification.
  github-action:
    name: reusable action (${{ matrix.os }})
    if: github.repository == 'pboachie/tungsten' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TUNGSTEN_RELEASE: "0.1.3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install only
        id: install
        uses: ./actions/tungsten
        with:
          version: ${{ env.TUNGSTEN_RELEASE }}
          install-only: "true"
      - name: Prepare a consumer project
        env:
          CONSUMER: ${{ runner.temp }}/consumer
        run: |
          set -euo pipefail
          tungsten --version
          mkdir -p "$CONSUMER/proj" "$CONSUMER/bad"
          cp examples/ci-drift/openapi.json "$CONSUMER/proj/openapi.json"
          cat > "$CONSUMER/proj/tungsten.yml" <<'MANIFEST'
          {"tungsten": 1, "api": {"name": "petstore", "title": "Gallery Petstore"},
           "inputs": [{"namespace": "pets", "spec": "openapi.json"}],
           "servers": {"default": "http://127.0.0.1:4010"},
           "targets": {"docs": {"out": "sdk"}}}
          MANIFEST
          cp "$CONSUMER/proj/openapi.json" "$CONSUMER/bad/openapi.json"
          printf 'tungsten: 1\ninputs: [\n' > "$CONSUMER/bad/tungsten.yml"
          (cd "$CONSUMER/proj" && tungsten generate)
      - name: Unchanged contract passes
        uses: ./actions/tungsten
        with:
          version: ${{ env.TUNGSTEN_RELEASE }}
          working-directory: ${{ runner.temp }}/consumer
          projects: proj
      - name: Change the contract without regenerating
        env:
          SPEC: ${{ runner.temp }}/consumer/proj/openapi.json
        run: |
          python3 - "$SPEC" <<'PY'
          import json, sys
          spec = json.load(open(sys.argv[1]))
          spec["paths"]["/status"] = {"get": {"operationId": "getStatus", "responses": {"204": {"description": "healthy"}}}}
          json.dump(spec, open(sys.argv[1], "w"), indent=2)
          PY
      - name: Stale output and an invalid manifest fail
        id: stale
        continue-on-error: true
        uses: ./actions/tungsten
        with:
          version: ${{ env.TUNGSTEN_RELEASE }}
          working-directory: ${{ runner.temp }}/consumer
          projects: |
            proj
            bad
      - name: Check the failure report
        env:
          OUTCOME: ${{ steps.stale.outcome }}
          FAILED: ${{ steps.stale.outputs.failed }}
          LOG_DIR: ${{ steps.stale.outputs.log-dir }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          printf '%s\n' "$FAILED"
          test "$(printf '%s' "$FAILED")" = "$(printf 'proj: generate --check\nbad: check\nbad: generate --check')"
          grep -q TG0901 "$LOG_DIR/2-generate-check.log"
      - name: Regenerate
        working-directory: ${{ runner.temp }}/consumer/proj
        run: tungsten generate
      - name: Regenerated output passes
        uses: ./actions/tungsten
        with:
          version: ${{ env.TUNGSTEN_RELEASE }}
          working-directory: ${{ runner.temp }}/consumer
          projects: proj
