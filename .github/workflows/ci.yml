# Public CI: format, lint, build and dependency policy. The test suite lives in
# the private tungsten-ops repository; the last job asks it to test this commit
# and it reports back as the commit status "tungsten-ops/ci".
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  dispatch-ops:
    name: request tungsten-ops tests
    needs: [check, deny]
    # Pushes only: a same-repository pull request head is already a pushed
    # commit, and fork pull requests have no access to the token. For those a
    # maintainer runs the ops workflow by hand with the head SHA.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      OPS_DISPATCH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
    steps:
      - name: Skip without a dispatch token
        if: env.OPS_DISPATCH_TOKEN == ''
        run: echo "OPS_DISPATCH_TOKEN is not available; tungsten-ops/ci must be triggered by a maintainer."
      - name: Dispatch tungsten-commit to tungsten-ops
        if: env.OPS_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          gh api --method POST repos/pboachie/tungsten-ops/dispatches \
            -f event_type=tungsten-commit \
            -f "client_payload[sha]=$SHA" \
            -f "client_payload[ref]=$REF"
          echo "dispatched tungsten-commit for $SHA ($REF)"
