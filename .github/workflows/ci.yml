# Public CI: repository rules, format, lint, build (Rust, Go, Java, C#, Ruby and Dart) and
# dependency policy. The test suite lives in the private tungsten-ops repository; the last
# job asks it to test this commit and it reports back as the commit status "tungsten-ops/ci".
#
# The job names "fmt, clippy, build", "cargo-deny" and "repository-guard" are
# required status checks of the main branch ruleset: renaming a job breaks
# merging until the ruleset is updated.
#
# Hardening: read-only token by default and per job, third-party actions pinned
# by commit SHA (Dependabot keeps them current), no pull_request_target, and
# the secret-bearing dispatch job never runs for pull requests or forks.
name: ci

# The gh-pages branch holds the generated documentation site (written only by
# the docs workflow in tungsten-ops, never edited by hand) and is not code, so
# pushes to it run no checks; the repository guard describes the exception.
on:
  push:
    branches: ["**", "!gh-pages"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel runs on main: every main commit keeps its checks.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-python's archive installer upgrades pip before returning; force
      # that bootstrap to use only the PSF hash-verified local wheel.
      - name: Stage verified pip for interpreter setup
        shell: bash
        run: python -I crates/tungsten-cli/src/commands/bootstrap_python.py --fetch-only --wheel-dir "$RUNNER_TEMP/tungsten-pip-bootstrap"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        env:
          PIP_CONFIG_FILE: ${{ runner.os == 'Windows' && 'nul' || '/dev/null' }}
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: ${{ runner.temp }}/tungsten-pip-bootstrap/pip-26.2.2-py3-none-any.whl
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        with:
          python-version: "3.12.15"
          check-latest: true
      - name: Read and check declared floors
        id: floors
        run: python3 .github/scripts/check-msrv.py --toolchains >> "$GITHUB_OUTPUT"
      - name: Install the declared minimum toolchains
        env:
          COMPILER_MSRV: ${{ steps.floors.outputs.compiler }}
          RUNTIME_MSRV: ${{ steps.floors.outputs.runtime }}
        run: |
          rustup toolchain install "$COMPILER_MSRV" "$RUNTIME_MSRV" --profile minimal
      - name: Reject dependencies above the declared floors
        run: python3 .github/scripts/check-msrv.py
      - name: Build the compiler and example at their declared minimum
        env:
          COMPILER_MSRV: ${{ steps.floors.outputs.compiler }}
          EXAMPLE_MSRV: ${{ steps.floors.outputs.example }}
        run: |
          cargo +"$COMPILER_MSRV" build --locked --workspace
          cargo +"$EXAMPLE_MSRV" build --locked --manifest-path examples/external-emitter-markdown/Cargo.toml
      - name: Check the Rust runtimes at their declared minimum
        env:
          RUNTIME_MSRV: ${{ steps.floors.outputs.runtime }}
        run: cargo +"$RUNTIME_MSRV" check --locked --workspace --manifest-path runtimes/rust/Cargo.toml

  check:
    name: fmt, clippy, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked
      - name: README support matrix matches the capability catalog
        run: python3 .github/scripts/check-support-matrix.py --tungsten target/debug/tungsten
      # The example external emitter is its own package (examples/ is excluded
      # from the workspace); its end-to-end test runs in tungsten-ops.
      - name: Example external emitter fmt, clippy, build
        working-directory: examples/external-emitter-markdown
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo build --locked
      # The Rust runtimes have a separate, committed lockfile.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtimes/rust
      - name: Rust runtimes (runtimes/rust) fmt
        working-directory: runtimes/rust
        run: cargo fmt --all --check
      - name: Rust runtimes (runtimes/rust) clippy
        working-directory: runtimes/rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust runtimes (runtimes/rust) build
        working-directory: runtimes/rust
        run: cargo build --locked --workspace

  dependencies:
    name: dependency sources and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-python's archive installer upgrades pip before returning; force
      # that bootstrap to use only the PSF hash-verified local wheel.
      - name: Stage verified pip for interpreter setup
        shell: bash
        run: python -I crates/tungsten-cli/src/commands/bootstrap_python.py --fetch-only --wheel-dir "$RUNNER_TEMP/tungsten-pip-bootstrap"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        env:
          PIP_CONFIG_FILE: ${{ runner.os == 'Windows' && 'nul' || '/dev/null' }}
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: ${{ runner.temp }}/tungsten-pip-bootstrap/pip-26.2.2-py3-none-any.whl
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        with:
          python-version: "3.12.15"
          check-latest: true
      - name: Check all committed Cargo, npm and uv locks without installing packages
        run: python3 .github/scripts/dependency_audit.py
      - name: Check lockstep runtime manifests and identities
        run: node .github/scripts/check-release-version.mjs --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-python's archive installer upgrades pip before returning; force
      # that bootstrap to use only the PSF hash-verified local wheel.
      - name: Stage verified pip for interpreter setup
        shell: bash
        run: python -I crates/tungsten-cli/src/commands/bootstrap_python.py --fetch-only --wheel-dir "$RUNNER_TEMP/tungsten-pip-bootstrap"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        env:
          PIP_CONFIG_FILE: ${{ runner.os == 'Windows' && 'nul' || '/dev/null' }}
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: ${{ runner.temp }}/tungsten-pip-bootstrap/pip-26.2.2-py3-none-any.whl
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        with:
          python-version: "3.12.15"
          check-latest: true
      # Keep this inside the existing required cargo-deny job, so an audit
      # failure cannot be ignored as an optional status check.
      - name: Check all committed dependency and release-tool locks without installing packages
        run: python3 .github/scripts/dependency_audit.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      # The Apache-2.0 runtimes have their own policy: runtimes/rust/deny.toml
      # (permissive licences only), found next to the manifest.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: runtimes/rust/Cargo.toml
          command: check
          arguments: --all-features

  # The Go runtime (runtimes/go) and the external Go emitter (emitters/go)
  # are standard-library modules of their own; their tests, and the build of
  # the SDKs the emitter generates, run in tungsten-ops.
  go:
    name: go fmt, vet, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l runtimes/go emitters/go)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Go runtime (runtimes/go) vet, build
        working-directory: runtimes/go
        run: |
          go vet ./...
          go build ./...
      - name: Go emitter (emitters/go) vet, build
        working-directory: emitters/go
        run: |
          go vet ./...
          go build -o /dev/null .

  # The Java runtime (runtimes/java, Java 17 bytecode, no dependencies). Its
  # tests, and the build of the SDKs tungsten-emit-java generates, run in
  # tungsten-ops; the emitter crate is linted with the workspace above.
  java:
    name: java runtime build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.13+9.0.LTS"
          check-latest: true
      - name: Prepare job-local Java TLS trust
        run: python3 .github/scripts/prepare_java_ci_trust.py --major 21
      - name: Verify patched Java runtime and trust roots
        run: python3 .github/scripts/check_java_toolchain.py --major 21
      - name: javac --release 17 -Xlint:all -Werror
        working-directory: runtimes/java
        run: |
          find src/main/java -name '*.java' > "$RUNNER_TEMP/sources.txt"
          javac --release 17 -Xlint:all -Werror -encoding UTF-8 -d "$RUNNER_TEMP/classes" "@$RUNNER_TEMP/sources.txt"
      - name: mvn package
        working-directory: runtimes/java
        run: mvn -B -q package -DskipTests
      - name: Verify packaged Java notices
        run: python3 .github/scripts/check-archive-notices.py runtimes/java/target/tungsten-runtime-*.jar runtimes/java --prefix META-INF/

  # The Kotlin layer (runtimes/kotlin) compiled against the Java runtime's
  # classes with kotlinc -Werror, and the opt-in coroutines layer
  # (runtimes/kotlin/coroutines) against a pinned, checksum-verified
  # kotlinx-coroutines-core jar; their tests, and the build of the SDKs the
  # Kotlin emitter generates, run in tungsten-ops.
  kotlin:
    name: kotlin runtime build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      KOTLIN_VERSION: "2.4.21"
      KOTLIN_SHA256: 7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd
      KOTLINX_COROUTINES_VERSION: "1.10.2"
      KOTLINX_COROUTINES_SHA256: 5ca175b38df331fd64155b35cd8cae1251fa9ee369709b36d42e0a288ccce3fd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.13+9.0.LTS"
          check-latest: true
      - name: Prepare job-local Java TLS trust
        run: python3 .github/scripts/prepare_java_ci_trust.py --major 21
      - name: Verify patched Java runtime and trust roots
        run: python3 .github/scripts/check_java_toolchain.py --major 21
      - name: Install kotlinc (sha256 checked)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kotlin.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          echo "$KOTLIN_SHA256  $RUNNER_TEMP/kotlin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: javac --release 17 (runtimes/java)
        run: |
          find runtimes/java/src/main/java -name '*.java' > "$RUNNER_TEMP/java.txt"
          javac --release 17 -Xlint:all -Werror -encoding UTF-8 -d "$RUNNER_TEMP/java" "@$RUNNER_TEMP/java.txt"
      - name: kotlinc -Werror -jvm-target 17 (runtimes/kotlin)
        run: |
          find runtimes/kotlin/src/main/kotlin -name '*.kt' | sort > "$RUNNER_TEMP/kotlin.txt"
          kotlinc -Werror -jvm-target 17 -Xexplicit-api=strict -cp "$RUNNER_TEMP/java" -d "$RUNNER_TEMP/kotlin-classes" "@$RUNNER_TEMP/kotlin.txt"
      - name: Fetch kotlinx-coroutines-core (sha256 checked)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kotlinx-coroutines.jar" \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/$KOTLINX_COROUTINES_VERSION/kotlinx-coroutines-core-jvm-$KOTLINX_COROUTINES_VERSION.jar"
          echo "$KOTLINX_COROUTINES_SHA256  $RUNNER_TEMP/kotlinx-coroutines.jar" | sha256sum -c -
      - name: kotlinc -Werror -jvm-target 17 (runtimes/kotlin/coroutines)
        run: |
          find runtimes/kotlin/coroutines/src/main/kotlin -name '*.kt' | sort > "$RUNNER_TEMP/coroutines.txt"
          kotlinc -Werror -jvm-target 17 -Xexplicit-api=strict -cp "$RUNNER_TEMP/java:$RUNNER_TEMP/kotlin-classes:$RUNNER_TEMP/kotlinx-coroutines.jar" -d "$RUNNER_TEMP/coroutines-classes" "@$RUNNER_TEMP/coroutines.txt"

  # The .NET runtime (runtimes/csharp, net10.0, no dependencies); its tests,
  # and the build of the SDKs the C# emitter generates, run in tungsten-ops.
  csharp:
    name: csharp runtime build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: dotnet format whitespace
        run: dotnet format whitespace runtimes/csharp --folder --verify-no-changes
      - name: dotnet build -warnaserror
        run: dotnet build runtimes/csharp/Tungsten.Runtime.csproj -warnaserror --artifacts-path "$RUNNER_TEMP/csharp"
      - name: Pack and verify runtime notices
        run: |
          dotnet pack runtimes/csharp/Tungsten.Runtime.csproj -c Release --artifacts-path "$RUNNER_TEMP/csharp" -o "$RUNNER_TEMP/csharp-packages"
          python3 .github/scripts/check-archive-notices.py "$RUNNER_TEMP/csharp-packages/"*.nupkg runtimes/csharp

  # The F# layer over the .NET runtime (runtimes/fsharp, net10.0, FSharp.Core
  # pinned to the SDK's bundled version), built against runtimes/csharp; its
  # tests and the generated F# SDKs run in tungsten-ops.
  fsharp:
    name: fsharp runtime build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: dotnet build -warnaserror
        run: dotnet build runtimes/fsharp/Tungsten.Runtime.FSharp.fsproj -warnaserror --artifacts-path "$RUNNER_TEMP/fsharp"
      - name: Pack and verify runtime notices
        run: |
          dotnet pack runtimes/fsharp/Tungsten.Runtime.FSharp.fsproj -c Release --artifacts-path "$RUNNER_TEMP/fsharp" -o "$RUNNER_TEMP/fsharp-packages"
          python3 .github/scripts/check-archive-notices.py "$RUNNER_TEMP/fsharp-packages/"*.nupkg runtimes/fsharp

  # The Ruby runtime (runtimes/ruby, standard library only): every file
  # passes `ruby -wc` without a warning and the gemspec builds; its tests,
  # RuboCop and the gems the Ruby emitter generates run in tungsten-ops.
  ruby:
    name: ruby runtime check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3.13"
          bundler-cache: false
      - name: ruby -wc
        run: |
          status=0
          for f in $(find runtimes/ruby -name '*.rb' -o -name '*.gemspec' -o -name Gemfile | sort); do
            result="$(ruby -wc "$f" 2>&1)" || true
            if [ "$result" != "Syntax OK" ]; then echo "$f: $result"; status=1; fi
          done
          exit $status
      - name: gem build
        working-directory: runtimes/ruby
        run: gem build tungsten-runtime.gemspec --output "$RUNNER_TEMP/tungsten-runtime.gem"

  # The Dart runtime (runtimes/dart, dart:io plus package:crypto): `dart pub
  # get`, `dart format` without changes and `dart analyze --fatal-infos` with
  # the committed analysis options; its tests and the packages the Dart
  # emitter generates run in tungsten-ops.
  dart:
    name: dart runtime check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - name: dart pub get
        working-directory: runtimes/dart
        run: dart pub get
      - name: dart format
        working-directory: runtimes/dart
        run: dart format --output=none --set-exit-if-changed .
      - name: dart analyze --fatal-infos
        working-directory: runtimes/dart
        run: dart analyze --fatal-infos

  guard:
    name: repository-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the commit range of the push or pull request.
          fetch-depth: 0
          persist-credentials: false
      - name: Code only, licence headers, no AI attribution
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Pull request: its commits. Push: the pushed commits; a new branch or
          # a force push is checked from its merge base with the default branch.
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            head="$GITHUB_SHA"; base="$BEFORE"
            if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git merge-base "origin/$DEFAULT_BRANCH" "$head" 2>/dev/null || true)"
            fi
          fi
          echo "commits: ${base:-<root>}..$head"
          python3 .github/scripts/repository_guard.py --ref HEAD --range "$base" "$head"

  dispatch-ops:
    name: request tungsten-ops tests
    needs: [check, deny, guard]
    # Pushes to branches of this repository only (only accounts with write
    # access can push them). Never for pull requests, whose code may come from
    # a fork, and never in forks: a same-repository pull request head is
    # already a pushed commit, and for fork pull requests a maintainer runs the
    # ops workflow by hand with the head SHA. Every branch is dispatched, not
    # only main, because the tungsten-ops/ci status must land on pull request
    # head commits for branch protection.
    # Disabled by default after migration. A maintainer may opt in only for a
    # reviewed rollback with an active private legacy receiver.
    if: vars.LEGACY_OPS_DISPATCH == 'true' && github.event_name == 'push' && github.repository == 'pboachie/tungsten'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The job uses only OPS_DISPATCH_TOKEN; the run's own token gets nothing.
    permissions: {}
    env:
      OPS_DISPATCH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
    steps:
      - name: Skip without a dispatch token
        if: env.OPS_DISPATCH_TOKEN == ''
        run: echo "OPS_DISPATCH_TOKEN is not available; tungsten-ops/ci must be triggered by a maintainer."
      - name: Dispatch tungsten-commit to tungsten-ops
        if: env.OPS_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          gh api --method POST repos/pboachie/tungsten-ops/dispatches \
            -f event_type=tungsten-commit \
            -f "client_payload[sha]=$SHA" \
            -f "client_payload[ref]=$REF"
          echo "dispatched tungsten-commit for $SHA ($REF)"
