# npm publishing is performed by release.yml after this controller-reported check succeeds.
# No registry or GitHub write credential is passed to the worker.
when:
  - event: tag
    ref: refs/tags/v*

labels:
  backend: kubernetes
  platform: linux/amd64

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      home: /tmp
      ref: ${CI_COMMIT_SHA}
      depth: 0
      lfs: false
      recursive: false
    backend_options:
      kubernetes:
        securityContext: &restricted
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}

steps:
  - name: validate-npm-artifacts
    image: node:22.23.4-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    commands:
      - test "$CI_REPO" = pboachie/tungsten
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - git fetch origin main
      - git merge-base --is-ancestor HEAD FETCH_HEAD
      - node .github/scripts/check-release-version.mjs
      # 20 minutes matches the GitHub-side npm-artifacts job budget: this
      # worker is CPU-limited, and a step killed here turns a queued release
      # into a failed validation instead of a slower one.
      - timeout --signal=TERM --kill-after=30s 20m node .github/scripts/check-runtime-artifacts.mjs runtime-dist
    backend_options:
      kubernetes:
        securityContext: *restricted
        resources:
          requests: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}
          limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 4Gi}
