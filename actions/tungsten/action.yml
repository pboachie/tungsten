# SPDX-License-Identifier: AGPL-3.0-only
# Reusable action: install a pinned, verified tungsten release and run the
# contract checks. Reference it by full commit SHA:
#
#   - uses: pboachie/tungsten/actions/tungsten@<commit> # vX.Y.Z
#     with:
#       version: X.Y.Z
#
# See README.md in this directory for inputs, outputs and the trust model.
name: tungsten check
description: >-
  Install a pinned, checksum- and provenance-verified tungsten release and run
  `tungsten check`, `tungsten generate --check` and `tungsten lock --check`.
author: pboachie

inputs:
  version:
    description: >-
      The tungsten release to install, for example `0.1.3` (no default: pin it).
    required: true
  projects:
    description: >-
      Projects to check, one per line: a directory with a tungsten.yml or a
      tungsten*.yml manifest, relative to `working-directory`. Checked in the
      order given.
    required: false
    default: "."
  workspace:
    description: >-
      Instead of `projects`: a workspace root, relative to `working-directory`.
      The projects are those `tungsten workspace` discovers there, narrowed by
      `workspace-projects` and the affected files, checked in discovery order.
      Needs a tungsten release with `tungsten workspace`.
    required: false
    default: ""
  workspace-projects:
    description: With `workspace`, only these project ids, one per line (`tungsten workspace --project`).
    required: false
    default: ""
  affected-files:
    description: >-
      With `workspace`, only the projects that depend on one of these files,
      one per line, relative to `working-directory` (`tungsten workspace
      --affected`). Combined with `affected-base`.
    required: false
    default: ""
  affected-base:
    description: >-
      With `workspace`, add the files changed between this commit and HEAD
      (`git diff <base>...HEAD`, both sides of renames) to the affected files,
      for example `github.event.pull_request.base.sha`. Needs that history in
      the checkout (`fetch-depth: 0`). When affected files are requested and
      none changed, no project is checked.
    required: false
    default: ""
  working-directory:
    description: Directory the project paths are relative to.
    required: false
    default: "."
  check:
    description: "Run `tungsten check` (`true` or `false`)."
    required: false
    default: "true"
  generate-check:
    description: "Run `tungsten generate --check`: fail (TG0901) on stale generated output."
    required: false
    default: "true"
  lock-check:
    description: >-
      Run `tungsten lock --check`: `auto` (when the project has a
      tungsten.lock.json), `true` or `false`.
    required: false
    default: "auto"
  locked:
    description: "Pass `--locked` to check and generate: fail (TG0128) unless the project matches its lock."
    required: false
    default: "false"
  strict:
    description: "Pass `--strict` to check and generate: treat warnings as errors."
    required: false
    default: "false"
  allow-external:
    description: >-
      Start the commands of `external` targets (`true` or `false`). Off by
      default. Ignored, with a warning, for pull requests from forks and for
      `pull_request_target` events.
    required: false
    default: "false"
  scenarios:
    description: >-
      Saved mock scenarios to run after the checks, one per line:
      `<scenario.json> [--expect-exit N] [--timeout-ms N] [--max-calls N] --
      <command> [args...]`. Split on whitespace, never through a shell. Each
      runs `tungsten scenario run <scenario-input> --scenario <file> ... --
      <command>`. Refused on `pull_request_target`.
    required: false
    default: ""
  scenario-input:
    description: The project, manifest or OpenAPI document the scenarios run against, relative to `working-directory`.
    required: false
    default: "."
  install-only:
    description: "Only install tungsten and add it to PATH; run no checks."
    required: false
    default: "false"
  token:
    description: >-
      GitHub token for the provenance check of the release archive. Only the
      install step sees it; it needs no permissions beyond reading public
      attestations.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The output of `tungsten --version`.
    value: ${{ steps.install.outputs.version }}
  bin-dir:
    description: The directory holding the installed `tungsten` binary (also added to PATH).
    value: ${{ steps.install.outputs.bin-dir }}
  log-dir:
    description: Directory with one log file per check (`<n>-<step>.log`), for upload as an artifact.
    value: ${{ steps.checks.outputs.log-dir }}
  projects:
    description: The number of projects checked (0 when a workspace selection matched none).
    value: ${{ steps.checks.outputs.projects }}
  failed:
    description: "The failed checks, one `<project>: <step>` per line; empty when everything passed."
    value: ${{ steps.checks.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Install tungsten ${{ inputs.version }}
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS_NAME" = "Windows" ]; then
          echo "::error title=tungsten::this action supports Linux and macOS runners; on Windows use install.ps1"
          exit 1
        fi
        if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
          echo "::error title=tungsten::input 'version' must be a release version such as 0.1.3"
          exit 1
        fi
        version="v${INPUT_VERSION#v}"
        # The installer at the same commit as this action: pinning the action
        # by SHA pins the installer. It checks the archive against the
        # release's SHA256SUMS and its build provenance (GitHub CLI 2.102.0+).
        # Provenance verification needs GitHub CLI 2.102.0 or newer. Say how to
        # get it before the installer refuses; never fall back to checksums only.
        gh_version=$(gh --version 2>/dev/null | awk 'NR == 1 { print $3 }' || true)
        if [ -z "$gh_version" ] || ! printf '%s\n' "$gh_version" | awk -F. '{ exit !(NF >= 2 && ($1 > 2 || ($1 == 2 && $2 >= 102))) }'; then
          echo "::error title=tungsten::GitHub CLI 2.102.0 or newer is required to verify the release provenance; this runner has ${gh_version:-no gh}. Update it in an earlier step (on macOS images: brew upgrade gh) or use a runner image with a newer GitHub CLI"
          exit 1
        fi
        installer="$GITHUB_ACTION_PATH/../../install.sh"
        [ -f "$installer" ] || { echo "::error title=tungsten::install.sh not found next to the action"; exit 1; }
        bin_dir="$RUNNER_TEMP/tungsten-$version/bin"
        unset TUNGSTEN_NO_ATTESTATION TUNGSTEN_RELEASE_BASE_URL TUNGSTEN_REPO
        sh "$installer" --version "$version" --dir "$bin_dir"
        echo "$bin_dir" >> "$GITHUB_PATH"
        installed="$("$bin_dir/tungsten" --version)"
        echo "$installed"
        {
          echo "bin-dir=$bin_dir"
          echo "version=$installed"
        } >> "$GITHUB_OUTPUT"

    - name: Run the tungsten checks
      id: checks
      if: inputs.install-only != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PROJECTS: ${{ inputs.projects }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_WORKSPACE_PROJECTS: ${{ inputs.workspace-projects }}
        INPUT_AFFECTED_FILES: ${{ inputs.affected-files }}
        INPUT_AFFECTED_BASE: ${{ inputs.affected-base }}
        INPUT_SCENARIOS: ${{ inputs.scenarios }}
        INPUT_SCENARIO_INPUT: ${{ inputs.scenario-input }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_GENERATE_CHECK: ${{ inputs.generate-check }}
        INPUT_LOCK_CHECK: ${{ inputs.lock-check }}
        INPUT_LOCKED: ${{ inputs.locked }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_ALLOW_EXTERNAL: ${{ inputs.allow-external }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
        TUNGSTEN: ${{ steps.install.outputs.bin-dir }}/tungsten
      run: |
        set -euo pipefail
        bool() { # bool NAME VALUE: print true or false, fail on anything else
          case "$2" in
            true | false) printf '%s' "$2" ;;
            *) echo "::error title=tungsten::input '$1' must be true or false, not '$2'" >&2; return 1 ;;
          esac
        }
        run_check=$(bool check "$INPUT_CHECK")
        run_generate=$(bool generate-check "$INPUT_GENERATE_CHECK")
        locked=$(bool locked "$INPUT_LOCKED")
        strict=$(bool strict "$INPUT_STRICT")
        allow_external=$(bool allow-external "$INPUT_ALLOW_EXTERNAL")
        case "$INPUT_LOCK_CHECK" in
          auto | true | false) ;;
          *) echo "::error title=tungsten::input 'lock-check' must be auto, true or false"; exit 1 ;;
        esac

        # A pull request can change the manifest, and an external target's
        # command runs with the job's privileges. Never start one for a fork
        # or under pull_request_target, whatever the input says.
        if [ "$allow_external" = true ]; then
          if [ "$EVENT_NAME" = pull_request_target ]; then
            echo "::warning title=tungsten::allow-external ignored on pull_request_target"
            allow_external=false
          elif [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" != "$REPOSITORY" ]; then
            echo "::warning title=tungsten::allow-external ignored for a pull request from a fork"
            allow_external=false
          fi
        fi
        if [ "$allow_external" = true ]; then
          unset TUNGSTEN_NO_EXTERNAL
        else
          export TUNGSTEN_NO_EXTERNAL=1
        fi

        flags=()
        [ "$locked" = true ] && flags+=(--locked)
        [ "$strict" = true ] && flags+=(--strict)

        log_dir="$RUNNER_TEMP/tungsten-logs"
        rm -rf "$log_dir"
        mkdir -p "$log_dir"
        echo "log-dir=$log_dir" >> "$GITHUB_OUTPUT"

        failed=()
        rows=()
        n=0
        step() { # step PROJECT NAME COMMAND...: run one check, log and record it
          local project=$1 name=$2 log status
          shift 2
          n=$((n + 1))
          log="${name// --/-}"
          log="$log_dir/$n-${log//[^A-Za-z0-9.-]/-}.log"
          echo "::group::tungsten $name ($project)"
          set +e
          "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"
          if [ "$status" -eq 0 ]; then
            rows+=("| \`$project\` | \`$name\` | passed |")
          else
            failed+=("$project: $name")
            rows+=("| \`$project\` | \`$name\` | failed (exit $status) |")
            echo "::error title=tungsten $name failed::$project: exit status $status; see the log above or $log"
          fi
        }

        lines() { # lines TEXT: print the nonblank lines of TEXT, trimmed
          local line
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -n "$line" ] && printf '%s\n' "$line"
          done <<< "$1"
          return 0
        }
        inside() { # inside INPUT PATH: refuse a path outside the working directory
          case "$2" in
            -* | /* | .. | ../* | */.. | */../*)
              echo "::error title=tungsten::$1 '$2' must be a relative path inside the working directory"
              exit 1 ;;
          esac
        }

        # names[i] is how project i is reported, paths[i] what tungsten gets.
        names=()
        paths=()
        selection="projects"
        if [ -n "$INPUT_WORKSPACE" ]; then
          if [ "$INPUT_PROJECTS" != "." ]; then
            echo "::error title=tungsten::set either 'projects' or 'workspace', not both"
            exit 1
          fi
          inside workspace "$INPUT_WORKSPACE"
          [ -d "$INPUT_WORKSPACE" ] || { echo "::error title=tungsten::workspace '$INPUT_WORKSPACE' is not a directory"; exit 1; }
          ws_args=()
          while IFS= read -r id; do
            case "$id" in -*) echo "::error title=tungsten::project id '$id' must not start with '-'"; exit 1 ;; esac
            ws_args+=(--project "$id")
          done < <(lines "$INPUT_WORKSPACE_PROJECTS")
          affected=()
          while IFS= read -r file; do
            inside "affected file" "$file"
            affected+=("$file")
          done < <(lines "$INPUT_AFFECTED_FILES")
          if printf '%s' "$INPUT_AFFECTED_BASE" | grep -Eq '^0+$'; then
            # github.event.before of a new branch: no base, check every project.
            echo "::notice title=tungsten::affected-base is all zeros (a new branch); checking every selected project"
            INPUT_AFFECTED_BASE=
          fi
          if [ -n "$INPUT_AFFECTED_BASE" ]; then
            if ! printf '%s' "$INPUT_AFFECTED_BASE" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
              echo "::error title=tungsten::input 'affected-base' must be a commit SHA or a ref name"
              exit 1
            fi
            if ! git rev-parse --verify --quiet "$INPUT_AFFECTED_BASE^{commit}" > /dev/null; then
              echo "::error title=tungsten::affected-base '$INPUT_AFFECTED_BASE' is not in the checkout; check out with fetch-depth: 0"
              exit 1
            fi
            top=$(git rev-parse --show-toplevel)
            while IFS= read -r -d '' file; do
              affected+=("$top/$file")
            done < <(git diff --name-only --no-renames -z "$INPUT_AFFECTED_BASE...HEAD" --)
          fi
          selection="workspace \`$INPUT_WORKSPACE\`"
          if [ -n "$INPUT_AFFECTED_FILES$INPUT_AFFECTED_BASE" ]; then
            selection="$selection, ${#affected[@]} affected file(s)"
            for file in ${affected[@]+"${affected[@]}"}; do
              ws_args+=(--affected "$file")
            done
          fi
          ws_json="$log_dir/workspace.json"
          if [ -n "$INPUT_AFFECTED_FILES$INPUT_AFFECTED_BASE" ] && [ "${#affected[@]}" -eq 0 ]; then
            echo "No file changed: no project is affected."
          elif ! "$TUNGSTEN" workspace "$INPUT_WORKSPACE" ${ws_args[@]+"${ws_args[@]}"} --json > "$ws_json"; then
            "$TUNGSTEN" workspace "$INPUT_WORKSPACE" ${ws_args[@]+"${ws_args[@]}"} || true
            echo "::error title=tungsten workspace failed::project discovery or selection failed; see the log above"
            exit 1
          else
            "$TUNGSTEN" workspace "$INPUT_WORKSPACE" ${ws_args[@]+"${ws_args[@]}"}
            while IFS= read -r -d '' id && IFS= read -r -d '' manifest; do
              names+=("$id")
              paths+=("$INPUT_WORKSPACE/$manifest")
            done < <(python3 -I -c '
        import json, sys
        for p in json.load(open(sys.argv[1]))["result"]["projects"]:
            sys.stdout.write(p["id"] + "\0" + p["manifest"] + "\0")
        ' "$ws_json")
          fi
        else
          while IFS= read -r project; do
            inside project "$project"
            [ -e "$project" ] || { echo "::error title=tungsten::project '$project' does not exist"; exit 1; }
            names+=("$project")
            paths+=("$project")
          done < <(lines "$INPUT_PROJECTS")
          [ "${#paths[@]}" -gt 0 ] || { echo "::error title=tungsten::input 'projects' is empty"; exit 1; }
        fi
        echo "projects=${#paths[@]}" >> "$GITHUB_OUTPUT"

        # Scenario lines are validated before any check runs. Each becomes
        # the argv of one `tungsten scenario run`, one word per line in
        # $scenario_dir/<index> (words never contain a newline).
        scenario_names=()
        scenario_dir="$log_dir/scenarios"
        mkdir -p "$scenario_dir"
        if [ -n "$(lines "$INPUT_SCENARIOS")" ]; then
          if [ "$EVENT_NAME" = pull_request_target ]; then
            echo "::error title=tungsten::scenarios run commands and are refused on pull_request_target"
            exit 1
          fi
          inside scenario-input "$INPUT_SCENARIO_INPUT"
          [ -e "$INPUT_SCENARIO_INPUT" ] || { echo "::error title=tungsten::scenario-input '$INPUT_SCENARIO_INPUT' does not exist"; exit 1; }
          while IFS= read -r line; do
            read -r -a words <<< "$line"
            file=${words[0]}
            inside scenario "$file"
            [ -f "$file" ] || { echo "::error title=tungsten::scenario '$file' does not exist"; exit 1; }
            argv=(scenario run "$INPUT_SCENARIO_INPUT" --scenario "$file")
            i=1
            while [ "$i" -lt "${#words[@]}" ] && [ "${words[$i]}" != "--" ]; do
              option=${words[$i]}
              value=${words[$((i + 1))]:-}
              case "$option" in
                --expect-exit | --timeout-ms | --max-calls) ;;
                *) echo "::error title=tungsten::scenario '$file': unknown option '$option' (expected --expect-exit, --timeout-ms, --max-calls or --)"; exit 1 ;;
              esac
              case "$value" in
                '' | *[!0-9]*) echo "::error title=tungsten::scenario '$file': $option needs a number"; exit 1 ;;
              esac
              argv+=("$option" "$value")
              i=$((i + 2))
            done
            if [ "$i" -ge "${#words[@]}" ] || [ $((i + 1)) -ge "${#words[@]}" ]; then
              echo "::error title=tungsten::scenario '$file': give the command after --"
              exit 1
            fi
            argv+=("${words[@]:$i}")
            printf '%s\n' "${argv[@]}" > "$scenario_dir/${#scenario_names[@]}"
            scenario_names+=("$file")
          done < <(lines "$INPUT_SCENARIOS")
        fi

        for i in ${paths[@]+"${!paths[@]}"}; do
          name=${names[$i]}
          project=${paths[$i]}
          if [ -d "$project" ]; then root=$project; else root=$(dirname -- "$project"); fi

          [ "$run_check" = true ] && step "$name" check "$TUNGSTEN" check ${flags[@]+"${flags[@]}"} "$project"
          [ "$run_generate" = true ] && step "$name" "generate --check" "$TUNGSTEN" generate --check ${flags[@]+"${flags[@]}"} "$project"
          case "$INPUT_LOCK_CHECK" in
            true) step "$name" "lock --check" "$TUNGSTEN" lock --check "$project" ;;
            auto) [ -f "$root/tungsten.lock.json" ] && step "$name" "lock --check" "$TUNGSTEN" lock --check "$project" ;;
          esac
        done

        for index in ${scenario_names[@]+"${!scenario_names[@]}"}; do
          argv=()
          while IFS= read -r word; do
            argv+=("$word")
          done < "$scenario_dir/$index"
          step "$INPUT_SCENARIO_INPUT" "scenario ${scenario_names[$index]}" "$TUNGSTEN" "${argv[@]}"
        done

        {
          echo "### tungsten"
          echo
          echo "$("$TUNGSTEN" --version); external targets: $([ "$allow_external" = true ] && echo run || echo skipped)"
          echo
          echo "Selection: $selection; ${#paths[@]} project(s) checked."
          echo
          echo "| Project | Check | Result |"
          echo "|---|---|---|"
          [ "${#rows[@]}" -gt 0 ] && printf '%s\n' "${rows[@]}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo
            echo "Stale generated output (TG0901): run \`tungsten generate\` locally with the same release and commit the result."
            echo "A stale lock: review the change with \`tungsten lock --preview\`, then \`tungsten lock --update\`."
            echo "Any code: \`tungsten explain TG....\`."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        {
          echo "failed<<TUNGSTEN_FAILED_EOF"
          [ "${#failed[@]}" -gt 0 ] && printf '%s\n' "${failed[@]}"
          echo "TUNGSTEN_FAILED_EOF"
        } >> "$GITHUB_OUTPUT"
        [ "${#failed[@]}" -eq 0 ]
