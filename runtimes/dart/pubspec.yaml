# SPDX-License-Identifier: Apache-2.0
name: tungsten_runtime
description: >-
  The runtime of Dart SDKs generated by tungsten: pre-flight validation, auth,
  idempotency, confirmation, retries, error classification, previews,
  pagination, macros and server-sent event streams over dart:io.
version: 0.1.5
homepage: https://github.com/pboachie/tungsten
repository: https://github.com/pboachie/tungsten/tree/main/runtimes/dart
issue_tracker: https://github.com/pboachie/tungsten/issues

environment:
  sdk: ">=3.6.0 <4.0.0"

platforms:
  linux:
  macos:
  windows:

# BSD-3-Clause (dart-lang); SHA-256 and HMAC-SHA-256 for confirmation tokens,
# content hashes and PKCE.
dependencies:
  crypto: 3.0.7
