[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tungsten-runtime"
version = "0.1.0"
description = "Runtime for Python SDKs generated by tungsten: transport, retries, idempotency, diagnostic error envelopes, previews and pagination."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Prince Boachie" }]
keywords = ["openapi", "sdk", "agents", "mcp", "tungsten"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pboachie/tungsten"
Repository = "https://github.com/pboachie/tungsten"
Issues = "https://github.com/pboachie/tungsten/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_runtime"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# `ruff format` enforces the line length; it keeps long string literals
# (remediation texts) whole, which E501 would flag.
ignore = ["E501"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
