[package]
name = "tungsten-cli-kit"
description = "Command-line engine for CLIs generated by tungsten: clap command tree from a table, output contract, exit codes and the confirmation flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
tungsten-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "wrap_help"] }

[lints]
workspace = true
