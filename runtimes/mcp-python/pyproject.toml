# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tungsten-mcp"
version = "0.1.5"
readme = "README.md"
description = "Experimental native Python MCP server runtime for tungsten-generated APIs: stdio, discrete tools, previews and confirmation, envelope results."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Prince Boachie" }]
keywords = ["openapi", "mcp", "model-context-protocol", "agents", "tungsten"]
requires-python = ">=3.12"
dependencies = [
  "tungsten-runtime>=0.1.3,<0.2.0",
  # The official MCP Python SDK, pinned: its server API is not yet stable
  # across minor releases.
  "mcp==2.3.0",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pboachie/tungsten"
Repository = "https://github.com/pboachie/tungsten"
Issues = "https://github.com/pboachie/tungsten/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
