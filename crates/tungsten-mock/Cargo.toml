[package]
name = "tungsten-mock"
description = "IR-driven mock HTTP server with request validation, recording and failure injection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[features]
# Exposes internals for the private test harness in tungsten-ops.
testing = []

[dependencies]
tungsten-ir.workspace = true
serde.workspace = true
serde_json.workspace = true
# HTTP/1.1 server with per-connection control (drop and reset injections
# close the connection from the service); tokio drives it on the mock's own
# thread, http-body-util bounds and collects request bodies.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
# `pattern` checks for parameters and bodies. JSON Schema patterns are
# ECMA-262 regexes and real specs use look-around (ZROtext's workflow ids),
# which the plain regex crate rejects.
fancy-regex = "0.19"

[lints]
workspace = true
