[package]
name = "tungsten-emit"
description = "Shared emitter infrastructure: file sets, structured writers, imports, headers, output manifests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[features]
# Exposes internals for the private test harness in tungsten-ops.
testing = []

[dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
tungsten-core.workspace = true
tungsten-ir.workspace = true
tungsten-tokens.workspace = true
toml = "1.1"
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }

[lints]
workspace = true
