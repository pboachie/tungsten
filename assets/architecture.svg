<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 410" width="990" height="410" role="img" aria-labelledby="t d">
  <title id="t">tungsten architecture</title>
  <desc id="d">OpenAPI 3.0 and 3.1 documents, or alternative inputs that importers normalize to OpenAPI first (Swagger 2.0, Postman collections, saved cURL commands, HTTP request files, HAR captures and endpoint manifests), together with overlays and the tungsten.yml and agent.yml manifests, go through the frontend into a typed IR; the agent compiler adds safety, idempotency and disclosure rules, and the emitters write SDKs, a CLI, an MCP server and docs that depend on the runtimes.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .core { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 2; }
    .out { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .rt { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .arrow { stroke: #6b7280; stroke-width: 2; fill: none; }
    .head { fill: #6b7280; }
    text { fill: #111827; font: 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-weight: 700; font-size: 15px; }
    .s { font-size: 12px; fill: #4b5563; }
    .cap { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: 1px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #1f2937; stroke: #6b7280; }
      .core { fill: #312e81; stroke: #818cf8; }
      .out { fill: #064e3b; stroke: #34d399; }
      .rt { fill: #451a03; stroke: #fbbf24; }
      .arrow { stroke: #9ca3af; }
      .head { fill: #9ca3af; }
      text { fill: #f3f4f6; }
      .s { fill: #d1d5db; }
      .cap { fill: #9ca3af; }
    }
  </style>

  <rect class="bg" width="990" height="410" rx="12"/>
  <text class="cap" x="20" y="28">INPUTS</text>
  <text class="cap" x="300" y="28">COMPILER</text>
  <text class="cap" x="500" y="28">EMITTERS</text>

  <rect class="box" x="20" y="44" width="230" height="52" rx="8"/>
  <text class="h" x="36" y="66">OpenAPI 3.0 / 3.1</text>
  <text class="s" x="36" y="84">JSON or YAML documents</text>
  <rect class="box" x="20" y="104" width="230" height="76" rx="8"/>
  <text class="h" x="36" y="126">Alternative inputs</text>
  <text class="s" x="36" y="144">Swagger 2.0 · Postman v2.1</text>
  <text class="s" x="36" y="160">saved cURL · .http/.rest</text>
  <text class="s" x="36" y="176">HAR 1.2 · endpoint manifests</text>
  <rect class="box" x="20" y="188" width="230" height="52" rx="8"/>
  <text class="h" x="36" y="210">Overlays</text>
  <text class="s" x="36" y="228">patch the spec, keep it intact</text>
  <rect class="box" x="20" y="248" width="230" height="44" rx="8"/>
  <text class="h" x="36" y="268">tungsten.yml</text>
  <text class="s" x="36" y="286">shape: names and targets</text>
  <rect class="box" x="20" y="300" width="230" height="48" rx="8"/>
  <text class="h" x="36" y="320">agent.yml</text>
  <text class="s" x="36" y="338">safety, idempotency, macros</text>

  <path class="arrow" d="M250 70 H266 M250 142 H266 M250 214 H266 M250 270 H266 M250 324 H266 M266 70 V324 M266 196 H286"/>
  <path class="head" d="M286 190 L298 196 L286 202 Z"/>

  <rect class="core" x="300" y="44" width="150" height="304" rx="10"/>
  <text class="h" x="318" y="76">Frontend</text>
  <text class="s" x="318" y="96">imports normalize,</text>
  <text class="s" x="318" y="112">parse, resolve $ref,</text>
  <text class="s" x="318" y="128">apply overlays</text>
  <path class="arrow" d="M375 140 V158"/>
  <path class="head" d="M369 158 L375 170 L381 158 Z"/>
  <text class="h" x="318" y="194">Typed IR</text>
  <text class="s" x="318" y="214">versioned JSON,</text>
  <text class="s" x="318" y="230">tungsten ir dump</text>
  <path class="arrow" d="M375 242 V260"/>
  <path class="head" d="M369 260 L375 272 L381 260 Z"/>
  <text class="h" x="318" y="296">Agent compiler</text>
  <text class="s" x="318" y="316">tiers, tokens,</text>
  <text class="s" x="318" y="332">disclosure</text>

  <path class="arrow" d="M450 196 H486"/>
  <path class="head" d="M486 190 L498 196 L486 202 Z"/>

  <rect class="out" x="500" y="44" width="470" height="64" rx="8"/>
  <text class="h" x="516" y="70">SDKs</text>
  <text class="s" x="516" y="90">TypeScript, Python (sync and async), Rust</text>
  <rect class="out" x="500" y="124" width="470" height="64" rx="8"/>
  <text class="h" x="516" y="150">CLI</text>
  <text class="s" x="516" y="170">Rust command line over the Rust SDK, with --json and exit codes</text>
  <rect class="out" x="500" y="204" width="470" height="64" rx="8"/>
  <text class="h" x="516" y="230">MCP server</text>
  <text class="s" x="516" y="250">discrete or progressive tool listing</text>
  <rect class="out" x="500" y="284" width="470" height="64" rx="8"/>
  <text class="h" x="516" y="310">Docs</text>
  <text class="s" x="516" y="330">llms.txt, llms-full.txt, tools.json</text>

  <path class="arrow" d="M735 348 V362"/>
  <path class="head" d="M729 362 L735 372 L741 362 Z"/>
  <rect class="rt" x="20" y="374" width="950" height="30" rx="8"/>
  <text class="s" x="36" y="394">Generated code depends on the Apache-2.0 runtimes: @elysra/tungsten-runtime, @elysra/tungsten-mcp, tungsten-runtime (Python, Rust), tungsten-cli-kit</text>
</svg>
