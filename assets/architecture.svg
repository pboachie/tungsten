<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="t d">
  <title id="t">Tungsten: alternative API inputs, shared compiler and supported outputs</title>
  <desc id="d">Choose one input: OpenAPI 3.0 or 3.1; Swagger 2.0, Postman v2.1, saved cURL, HTTP request files, HAR 1.2 or endpoint manifests; or a manual endpoint with explicit offline examples. Input acquisition can use local files or pinned HTTP and Git sources. Initialization normalizes imported inputs before the frontend resolves references and optional reviewed overlays. Project manifests and optional overlays are separate configuration, not additional required API inputs. A shared typed IR and agent compiler feed TypeScript, Python, Rust, Go, Java, Kotlin, C#, F#, Dart and Ruby SDKs; a Rust CLI; an MCP server; browser WebMCP tools; and agent documentation. Generated code uses the matching Apache-2.0 runtimes. See the README input and target matrices for restrictions, toolchains and package availability.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .config { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .core { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 2; }
    .out { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .rt { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .bus { stroke: #6b7280; stroke-width: 2; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: #6b7280; }
    text { fill: #111827; font: 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-weight: 700; font-size: 16px; }
    .s { font-size: 13px; fill: #4b5563; }
    .cap { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: 1px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box, .config { fill: #1f2937; stroke: #6b7280; }
      .core { fill: #312e81; stroke: #818cf8; }
      .out { fill: #064e3b; stroke: #34d399; }
      .rt { fill: #451a03; stroke: #fbbf24; }
      .arrow, .bus { stroke: #9ca3af; }
      .head { fill: #9ca3af; }
      text { fill: #f3f4f6; }
      .s { fill: #d1d5db; }
      .cap { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 Z"/></marker>
  </defs>
  <rect class="bg" width="1100" height="620" rx="12"/>
  <text class="cap" x="20" y="27">CHOOSE ONE INPUT</text>
  <text class="s" x="20" y="47">Local files or pinned HTTP / Git acquisition</text>
  <text class="cap" x="400" y="27">SHARED COMPILER</text>
  <text class="cap" x="675" y="27">OUTPUTS</text>

  <rect class="box" x="20" y="62" width="300" height="66" rx="8"/>
  <text class="h" x="36" y="88">OpenAPI 3.0 OR 3.1</text>
  <text class="s" x="36" y="111">Native JSON or YAML documents</text>
  <text class="cap" x="157" y="151">OR</text>
  <rect class="box" x="20" y="166" width="300" height="112" rx="8"/>
  <text class="h" x="36" y="193">Imported descriptions</text>
  <text class="s" x="36" y="216">Swagger 2.0 OR Postman v2.1</text>
  <text class="s" x="36" y="238">saved cURL OR .http / .rest OR HAR 1.2</text>
  <text class="s" x="36" y="260">OR declared-model endpoint manifests</text>
  <text class="cap" x="157" y="301">OR</text>
  <rect class="box" x="20" y="316" width="300" height="66" rx="8"/>
  <text class="h" x="36" y="342">Manual endpoint</text>
  <text class="s" x="36" y="365">Explicit method, route, offline examples</text>
  <path class="bus" d="M320 95 H355 V349 H320 M320 222 H355"/>
  <path class="arrow" d="M355 173 H398"/>

  <rect class="config" x="20" y="422" width="300" height="128" rx="8"/>
  <text class="h" x="36" y="449">Project configuration</text>
  <text class="s" x="36" y="474">tungsten.yml and agent.yml</text>
  <text class="s" x="36" y="498">Optional reviewed OpenAPI overlays</text>
  <text class="s" x="36" y="528">Separate from the chosen API input</text>
  <path class="arrow dash" d="M320 486 H375 V346 H398"/>

  <rect class="core" x="400" y="62" width="220" height="412" rx="10"/>
  <text class="h" x="420" y="91">Frontend</text>
  <text class="s" x="420" y="116">init normalizes imports;</text>
  <text class="s" x="420" y="138">parse and resolve references,</text>
  <text class="s" x="420" y="160">apply optional overlays</text>
  <path class="arrow" d="M510 179 V213"/>
  <text class="h" x="420" y="242">Typed IR</text>
  <text class="s" x="420" y="266">Versioned JSON contract</text>
  <text class="s" x="420" y="288">tungsten ir dump</text>
  <path class="arrow" d="M510 307 V341"/>
  <text class="h" x="420" y="370">Agent compiler</text>
  <text class="s" x="420" y="394">Safety, keys and confirmation</text>
  <text class="s" x="420" y="416">Verification and disclosure</text>
  <text class="s" x="420" y="450">One IR, target-specific limits</text>
  <path class="bus" d="M620 268 H645 V112 M645 268 V442"/>
  <path class="arrow" d="M645 112 H673"/>
  <path class="arrow" d="M645 208 H673"/>
  <path class="arrow" d="M645 286 H673"/>
  <path class="arrow" d="M645 364 H673"/>
  <path class="arrow" d="M645 442 H673"/>

  <rect class="out" x="675" y="62" width="405" height="100" rx="8"/>
  <text class="h" x="693" y="88">SDKs</text>
  <text class="s" x="693" y="112">TypeScript · Python · Rust · Go · Java</text>
  <text class="s" x="693" y="134">Kotlin · C# · F# · Dart · Ruby</text>
  <text class="s" x="693" y="153">Toolchains and availability: README target matrix</text>
  <rect class="out" x="675" y="176" width="405" height="64" rx="8"/>
  <text class="h" x="693" y="202">CLI</text>
  <text class="s" x="693" y="224">Rust command line over a generated Rust SDK</text>
  <rect class="out" x="675" y="254" width="405" height="64" rx="8"/>
  <text class="h" x="693" y="280">MCP server</text>
  <text class="s" x="693" y="302">Discrete or progressive; stdio or Streamable HTTP</text>
  <rect class="out" x="675" y="332" width="405" height="64" rx="8"/>
  <text class="h" x="693" y="358">Browser WebMCP tools</text>
  <text class="s" x="693" y="380">Browser package, tool manifest and registration</text>
  <rect class="out" x="675" y="410" width="405" height="64" rx="8"/>
  <text class="h" x="693" y="436">Agent documentation</text>
  <text class="s" x="693" y="458">llms.txt, llms-full.txt and tools.json</text>

  <rect class="rt" x="400" y="512" width="680" height="78" rx="8"/>
  <text class="h" x="420" y="539">Matching Apache-2.0 runtimes</text>
  <text class="s" x="420" y="561">Generated packages use their target runtime; documentation needs no runtime.</text>
  <text class="s" x="420" y="581">Source support does not establish registry publication or complete target parity.</text>
</svg>
