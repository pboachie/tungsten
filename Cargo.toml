[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["runtimes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/pboachie/tungsten"
homepage = "https://github.com/pboachie/tungsten"
documentation = "https://github.com/pboachie/tungsten#readme"
authors = ["Prince Boachie"]
keywords = ["openapi", "sdk", "codegen", "mcp", "agents"]
categories = ["development-tools", "command-line-utilities"]
publish = false

[workspace.dependencies]
tungsten-core = { path = "crates/tungsten-core" }
tungsten-config = { path = "crates/tungsten-config" }
tungsten-openapi = { path = "crates/tungsten-openapi" }
tungsten-ir = { path = "crates/tungsten-ir" }
tungsten-build = { path = "crates/tungsten-build" }
tungsten-agent = { path = "crates/tungsten-agent" }
tungsten-emit = { path = "crates/tungsten-emit" }
tungsten-emit-ts = { path = "crates/tungsten-emit-ts" }
tungsten-emit-docs = { path = "crates/tungsten-emit-docs" }
tungsten-mock = { path = "crates/tungsten-mock" }
tungsten-emit-mcp = { path = "crates/tungsten-emit-mcp" }
tungsten-emit-py = { path = "crates/tungsten-emit-py" }
tungsten-emit-rs = { path = "crates/tungsten-emit-rs" }
tungsten-tokens = { path = "crates/tungsten-tokens" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "1", features = ["preserve_order", "indexmap2"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
yaml-rust2 = "0.13"
url = "2"
semver = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
